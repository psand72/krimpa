extracted data.","engine":"Detects deleted records.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_byElement_detectDeletedRecords","fr":"Delta générique : détecte les clés disparues et génère des images de suppression.","kwFr":["delta","suppression","enregistrements supprimés","détection"],"kwEn":["delta","deleted records","deletion detection"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.byElement.ignoreDeletionAfterDays","values":[{"value":"Integer","desc":"Specified number of days."}],"meaning":"This annotation only makes sense together with Analytics.dataExtraction.delta.byElement.detectDeletedRecords. The extraction will ignore deleted records if they are older than the specified number of days. The main purpose is archiving. \nExample\nIf records are archived after two years, this value should be less than 700. In this case, the deletion in the database tables will be ignored if the record is only older than 700 days.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_byElement_ignoreDeletionAfterDays","fr":"Ignore les suppressions plus anciennes que N jours (ex. archivage) avec la détection des suppressions.","kwFr":["delta","suppression","archivage","jours"],"kwEn":["delta","deletions","archiving","days"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture","values":[],"meaning":"Use the CDC (change data capture) delta mechanism based on data base triggers.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture","fr":"Active le delta par CDC (Change Data Capture) fondé sur des triggers base de données.","kwFr":["delta","CDC","change data capture","trigger","temps réel"],"kwEn":["CDC","change data capture","trigger","delta"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture.automatic","values":[],"meaning":"In case of simple CDS views like projections no mapping information needs to be provided, but the relevant information about key fields etc. in inferred by the system.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture_automatic","fr":"CDC automatique : pour les vues simples (projections), le mapping des clés est déduit par le système.","kwFr":["CDC automatique","delta","projection"],"kwEn":["automatic CDC","delta","projection"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture.mapping","values":[],"meaning":"In case of more complex CDS views, e.g. using joins, mapping information needs to be provided. With this annotation you define the mapping of exposed elements in the CDS view and the underlying table key fields; see also example 3.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture_mapping","fr":"CDC avec mapping explicite : vues complexes (jointures), lien éléments de vue ↔ clés des tables.","kwFr":["CDC","mapping","jointure","tables journalisées","delta"],"kwEn":["CDC mapping","join","logged tables"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture.mapping.role","values":[{"value":"MAIN","desc":"The key of the extraction view corresponds exactly to the key of the underlying main table to be logged."},{"value":"LEFT_OUTER_TO_ONE_JOIN","desc":"There is a left outer join but not all requirements of role #COMPOSITION are met."}],"meaning":"","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture_mapping_role","fr":"Rôle de la table dans le mapping CDC : table principale ou jointure externe gauche to-one.","kwFr":["CDC","rôle","table principale","jointure externe"],"kwEn":["CDC role","main table","left outer join"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture.mapping.table","values":[],"meaning":"Name of the table to be logged.","engine":"","type":"String(30)","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture_mapping_table","fr":"Nom de la table à journaliser pour le CDC.","kwFr":["CDC","table","journalisation"],"kwEn":["CDC","table","logging"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture.mapping.viewElement","values":[],"meaning":"List of CDS view elements that map to key fields of the underlying tables.\nIf mapping.role LEFT_OUTER_TO_ONE_JOIN, the list enumerates all exposed CDS view element names that correspond to key fields in this underlying outer table; in other words that correspond to the foreign key fields used in the on-conditions of the joins.","engine":"","type":"array of ElementRef","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture_mapping_viewElement","fr":"Éléments de la vue correspondant aux champs clés de la table journalisée.","kwFr":["CDC","éléments de vue","clé","mapping"],"kwEn":["CDC","view elements","key mapping"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture.mapping.tableElement","values":[],"meaning":"List of table key fields that map to CDS view elements. \nNote\nBoth arrays, viewElement and tableElement, must contain the same number of elements and must list them in the same order so that corresponding fields match. Additionally, the array tableElement must contain exactly all key elements of the logging table without the client element.","engine":"","type":"array of ElementRef","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture_mapping_tableElement","fr":"Champs clés de la table correspondant aux éléments de la vue (même ordre).","kwFr":["CDC","champs clés","table","mapping"],"kwEn":["CDC","table key fields","mapping"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.changeDataCapture.mapping.filter","values":[{"value":"Code Syntax\narray of {\n tableElement : ElementRef; \n operator : String(11) enum; \n value : String(45); \n highValue : String(45);}","desc":"This annotation allows the definition of filters on the table to be logged for a CDS view. If the filter is one single value (no operator or operator #EQ) it can replace a missing mapping between viewElement and table Element. \nFilter on logging table: \n.tableElement: Name of the element in the logging table or view that is to be restricted. \n.operator: Restriction operator, possible values are: #EQ, #NOT_EQ, #GT, #GE, #LT, #LE, #BETWEEN and #NOT_BETWEEN; default is #EQ. \n.value: The filter value. \n.highValue: That specifies the upper value for ranges defined in combination with operators #BETWEEN or #NOT_BETWEEN."}],"meaning":"","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_changeDataCapture_mapping_filter","fr":"Filtre appliqué sur la table journalisée dans le mapping CDC.","kwFr":["CDC","filtre","table"],"kwEn":["CDC","filter"],"usages":["extract","filter"]},{"domain":"Analytics","name":"Analytics.dataExtraction.filter","values":[{"value":"Code Syntax\narray of {\n viewElement : ElementRef; \n operator : String(11) enum; \n value : String(45); \n highValue : String(45);}","desc":"Filter on logging table: \n.viewElement: Name of the element in the current view. \n.operator: Possible values are #EQ, #NOT_EQ, #GT, #GE, #LT, #LE, #BETWEEN and #NOT_BETWEEN; default is #EQ. \n.value: The filter value. \n.highValue: Only used in combination with operators #BETWEEN or #NOT_BETWEEN."}],"meaning":"Filters to be applied after the extraction of data.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_filter","fr":"Filtres appliqués après l’extraction des données.","kwFr":["extraction","filtre","restriction"],"kwEn":["extraction filter"],"usages":["extract","filter"]},{"domain":"Analytics","name":"Analytics.hidden","values":[{"value":"true","desc":"The element will not be added to the InfoProvider model of Analytics. You can use this flag if there are elements in the view, which shouldn't be part of the InfoProvider model of Analytics for technical reasons, but the flag can't be deleted because the view is not consumed by Analytics. Using this flag, you can avoid error messages from Analytics for these elements.\nThe view cannot be consumed by analytic clients. The default is true if this annotation is used."},{"value":"false","desc":"The view can be consumed by analytic clients."}],"meaning":"You can use this flag to decide whether the entity should be visible to analytic clients.","engine":"Views with Analytics.query are not exposed in value help. Views with Analytics.dataCategory are not exposed in value help for the CDS query designer.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT","VIEW"],"id":"Analytics_hidden","fr":"Masque la vue ou l’élément aux clients analytiques.","kwFr":["masquer","caché","invisible","analytique"],"kwEn":["hidden","hide","analytics"],"usages":["display"]},{"domain":"Analytics","name":"Analytics.internalName","values":[{"value":"local","desc":"At Element level: The element is assigned to a local InfoObject name. If not possible, an error is raised. This is useful if the annotation @Objec.Model.foreignKey.assocation should be added to an element of an existing view. The InfoObject name will then not change.\nAt View level: All elements for which it is possible will be assigned to a local InfoObject name. If it is used, @ObjectModel.foreignKey.assocation / @ObjectModel.text.assocation can be added, changed or removed without changing the InfoObject names."},{"value":"global","desc":"At Element level: The element is assigned to an InfoObject with a global name. If not possible, an error is raised. It can be used if there are multiple elements referencing to the same dimension (same target of the foreign key association). In this case, one element can be specified. This is then given the global name, while all others are given local names. If not specified, the first element is given the global name. It is especially useful for an existing element if a new element should be added, which should reference to the same dimension.\nAt View level: The default is global. All elements for which it is possible will be assigned to a global InfoObject name."}],"meaning":"With this annotation, the identifier which is used between BI Tools and the analytic manger can be influenced, meaning that adding @ObjectModel.foreignKey.association or @ObjectModel.text.association will not change the identifier.","engine":"It will be interpreted by the analytic manager. Note The CDS model is transformed to an InfoProvider or InfoObject model. The analytic protocols like INA or BICS are based on InfoProvider and InfoObject names. The elements of an analytic CDS view (CUBE, FACT, DIMENSION) are mapped to InfoObject names. If there is an @ObjectModel.foreignKey.assocation or @ObjectModel.text.assocation, and the target of the association is only used once, the InfoObject name is derived by default from the SQL view name of the target view. These names are called global. The InfoObject name for the representative key element of a dimension is always derived from the SQL view name of the dimension view. In all other cases, the InfoObject name is derived from the SQL view name of the view and the element name. These names are called local. If multiple elements are used in the ON condition of the foreign key association of an element, and the InfoObject name should be global, all other elements of the ON condition need to be global InfoObject names. This default behavior can be overruled with this annotation.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT","VIEW"],"id":"Analytics_internalName","fr":"Contrôle l’identifiant technique échangé entre outils BI et analytic manager (local / global).","kwFr":["nom interne","identifiant","stabilité","BI"],"kwEn":["internal name","identifier","BI tools"],"usages":["query"]},{"domain":"Analytics","name":"Analytics.planning.enabled","values":[{"value":"true","desc":"The view is enabled for planning. The default is true if this annotation is used. \nNote\nThe view has to select data from a view, which is annotated with Analytics.dataCategory: #AGGREGATIONLEVEL."},{"value":"false","desc":"The view is not enabled for planning."}],"meaning":"An input-enabled query provides writeback capabilities and can be used in planning scenarios.","engine":"Specifies which view will be interpreted as input-enabled analytic query by the analytic manager. Note This view must be annotated with Analytics.query: true.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_planning_enabled","fr":"Rend la requête saisissable (input-enabled) pour la planification avec write-back.","kwFr":["planification","saisie","write-back","input-ready"],"kwEn":["planning","input enabled","write-back"],"usages":["planning","query"]},{"domain":"Analytics","name":"Analytics.query","values":[{"value":"true","desc":"The query view will be exposed to the analytic manager. The default is true if this annotation is used. \nNote\nData will be selected from the view specified in the from clause. The view of the from clause has to be annotated with the Analytics.dataCategory as #DIMENSION, #CUBE or #AGGREGATIONLEVEL, and the DCL has to be assigned to the view of the from clause."},{"value":"false","desc":"The query view will not be exposed to the analytic manager."}],"meaning":"Query view classification.","engine":"By tagging the CDS view, the developer can specify which views will be exposed to the analytic manager. This type of view will be interpreted as an analytic query by the analytic manager. Note This view must not be annotated with Analytics.dataCategory = #NONE.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_query","fr":"Déclare la vue comme requête analytique exposée à l’analytic manager.","kwFr":["requête analytique","query","consommation","reporting","SAC","Analysis"],"kwEn":["analytical query","query view","reporting"],"usages":["query"]},{"domain":"Analytics","name":"Analytics.settings.maxProcessingEffort","values":[{"value":"low","desc":""},{"value":"medium","desc":""},{"value":"high","desc":"The default is high."},{"value":"unlimited","desc":""}],"meaning":"If InfoProviders store large amounts of data, certain queries can retrieve large result sets. The maxProcessingEffort is the maximum effort expected by analytic manager for processing the data it retrieves.","engine":"This annotation will be interpreted by the analytic manager for query views (Analytics.query: true).","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_settings_maxProcessingEffort","fr":"Effort de traitement maximal attendu pour la requête (gros volumes).","kwFr":["performance","volume","effort de traitement","limite"],"kwEn":["max processing effort","performance","large volume"],"usages":["perf","query"]},{"domain":"Analytics","name":"Analytics.settings.zeroValues.handling","values":[{"value":"show","desc":"You can specify that zeros are to be displayed (No zero suppression takes place). The default is show."},{"value":"hide","desc":"If you want to suppress zeros, there are two options available: hide and hide_if_all. For queries that have characteristics in the rows and key figures in the columns (or the other way around, with key figures in the rows and characteristics in the columns), the effect of the settings is identical. The two settings only differ in how they affect queries that have characteristics in the rows and columns (cross-classified table). If you use zero suppression with the hide value, the system checks whether there are zero values in the results area. If there are zero values in the results area, the corresponding row or column is hidden."},{"value":"hide_if_all","desc":"For queries that have characteristics in the rows and key figures in the columns (or the other way around, with key figures in the rows and characteristics in the columns), the effect of the value is identical to hide. If your query has characteristics in the rows and columns however (cross-classified table), and you use zero suppression with the hide_if_all value, the system hides all rows or columns that contain zero values.\nNote\nIf a detail row is not equal to zero (in a hierarchy for example), all superordinate rows are displayed, even if they contain zeros. As a result, the system ensures that the business context of the query is retained for the end user, even if the value hide_if_all is set."}],"meaning":"You can specify whether cells that contain zeros as values are to be displayed.","engine":"This annotation will be interpreted by the analytic manager for query views (Analytics.query: true).","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_settings_zeroValues_handling","fr":"Affichage des cellules à zéro (afficher, masquer, masquer si toutes nulles).","kwFr":["zéro","valeurs nulles","masquer","affichage"],"kwEn":["zero values","hide zeros","display"],"usages":["display","query"]},{"domain":"Analytics","name":"Analytics.settings.zeroValues.hideOnAxis","values":[{"value":"rows","desc":"Only rows that contain zeros as values are to be hidden."},{"value":"columns","desc":"Only columns that contain zeros as values are to be hidden."},{"value":"rows_columns","desc":"The default is rows_columns. Rows and columns that contain zeros as values are to be hidden."}],"meaning":"You can specify whether rows or columns that contain zeros as values are to be hidden.","engine":"This annotation will be interpreted by the analytic manager for query views (Analytics.query: true).","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_settings_zeroValues_hideOnAxis","fr":"Masque les lignes et/ou colonnes ne contenant que des zéros.","kwFr":["zéro","suppression des lignes nulles","axe"],"kwEn":["zero suppression","rows","columns"],"usages":["display","query"]},{"domain":"Analytics","name":"Analytics.viewModelReplication.enabled","values":[{"value":"true","desc":"The default is true."},{"value":"false","desc":"The view isn't enabled for view replication."}],"meaning":"The annotation is used to enable a view for view replication.","engine":"View replication is mainly used for analytical use cases.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_viewModelReplication_enabled","fr":"Autorise la réplication du modèle de vue.","kwFr":["réplication","modèle de vue"],"kwEn":["view model replication"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.writeBack.className","values":[{"value":"className as String","desc":"Name of an ABAP class, which implements the interface IF_RODPS_ODP_WRITEBACK."}],"meaning":"Views with Analytics.dataCategory: #AGGREGATIONLEVEL on top of this type of view can be used for planning scenarios. The ABAP class is used for saving the data, authorization checks and enqueuing.","engine":"Specifies which class enables the analytic manager to write data to the view. Note Only relevant if Analytics.dataCategory: #CUBE or Analytics.dataCategory: #FACT.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_writeBack_className","fr":"Classe ABAP de write-back (sauvegarde, autorisation, verrou) pour la planification.","kwFr":["planification","write-back","classe ABAP","sauvegarde"],"kwEn":["write-back","planning","ABAP class"],"usages":["planning"]},{"domain":"AnalyticsDetails","name":"AnalyticsDetails.exceptionAggregationSteps.exceptionAggregationBehavior","values":[{"value":"SUM","desc":"sum"},{"value":"MIN","desc":"minimum"},{"value":"MAX","desc":"maximum"},{"value":"NHA","desc":"NHA"},{"value":"COUNT","desc":"counter"},{"value":"COUNT_DISTINCT","desc":"counter_distinct"},{"value":"AVG","desc":"average"},{"value":"STD","desc":"standard deviation"},{"value":"FIRST","desc":"FIRST"},{"value":"LAST","desc":"LAST"}],"meaning":"Usually, the default aggregation determines how measures are aggregated in analytics. \nCaution\nThe default aggregation behavior cannot be defined in the query. It needs to be defined on the cube layer. \nIn some cases different aggregation behavior is needed for a special element of the entity (dimension of a cube). \nNote\nExample: A measure \"Inventory\" can be summed up for the different plants and other dimensions, but not for time – according to time the last or average value might be relevant. \nException aggregation is optional and is used to define different (to the default aggregation) aggregation behavior for specified elements. In general there can be multiple elements in which a measure has to be aggregated differently. Therefore a list of ExceptionAggregationSteps can be assigned. ExceptionAggregationBehavior defines the aggregation behavior. \nNote\nExample: In the query there is a measure, which should show the number of customers with positive sales - where sales is a measure of the underlying CUBE view with default aggregation SUM. When the sales measure is now used in a query with exceptionAggregationBehavior: COUNT and exceptionAggregationElements : Customer, the sales must first be aggregated (SUM) at customer level, and then COUNT has to be performed. If the sales for a customer is positive, this means that the sales is replaced by 1 (otherwise it is set to 0). This number can be summed up again.","engine":"The (logical) order in which the Analytic manager performes the aggregation is as follows: Firstly the DefaultAggregation is performed. This intermediate result is still grouped by all elements in the list of ExceptionAggregationSteps. The result is then aggregated by the exception aggregation in the order of StepNumber. The first remark holds even if the DefaultAggregation is FORMULA. This means that the calculation is performed when the result is still grouped by the exception aggregation elements. After the formula has been calculated, the result is aggregated according to the list of ExceptionAggregationSteps. This means that the aggregation level to be used for calculation can be defined precisely.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"AnalyticsDetails_exceptionAggregationSteps_exceptionAggregationBehavior","fr":"Agrégation d’exception en plusieurs étapes dans la requête (SUM, MAX, COUNT DISTINCT, AVG…).","kwFr":["agrégation d’exception","comptage distinct","moyenne","étape"],"kwEn":["exception aggregation","count distinct","steps"],"usages":["agg","query"]},{"domain":"AnalyticsDetails","name":"AnalyticsDetails.exceptionAggregationSteps.exceptionAggregationElements[ ]","values":[{"value":"array of elementRef","desc":"list of elements representing characteristics"}],"meaning":"The elements which should be aggregated in this step. These elements must represent characteristics.","engine":"Analytic manager: For more information see AnalyticsDetails.exceptionAggregationSteps.exceptionAggregationBehavior.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"AnalyticsDetails_exceptionAggregationSteps_exceptionAggregationElements","fr":"Caractéristiques de référence pour une étape mbination with Consumption.filter.selectionType : #HIERARCHY_NODE, then no mapping is needed, since this mapping can be derived from the PFCG-mapping. Only the nodes are selected which fit to the specified hierarchy.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["ELEMENT","PARAMETER"],"id":"Consumption_derivation_pfcgMapping","fr":"Dérivation depuis les autorisations PFCG de l’utilisateur (ex. nœuds de hiérarchie autorisés).","kwFr":["dérivation","PFCG","autorisation","variable d’autorisation"],"kwEn":["PFCG mapping","authorization variable"],"usages":["derive","auth"]},{"domain":"Consumption","name":"Consumption.derivation.resultElement","values":[{"value":"Values:","desc":"Description"},{"value":"elementRef","desc":""}],"meaning":"Element of the entity/scalar export parameter of the procedure providing the result.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["ELEMENT","PARAMETER"],"id":"Consumption_derivation_resultElement","fr":"Dérivation : élément du lookup fournissant le résultat.","kwFr":["dérivation","élément résultat"],"kwEn":["derivation result element"],"usages":["derive"]},{"domain":"Consumption","name":"Consumption.derivation.resultElementHigh","values":[{"value":"Values:","desc":"Description"},{"value":"elementRef","desc":""}],"meaning":"Element of the intervall export parameter of the procedure providing the result.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["ELEMENT","PARAMETER"],"id":"Consumption_derivation_resultElementHigh","fr":"Dérivation : élément fournissant la borne haute d’un intervalle.","kwFr":["dérivation","intervalle","borne haute"],"kwEn":["derivation","interval high"],"usages":["derive"]},{"domain":"Consumption","name":"Consumption.derivation.resultHierarchyNode.nodeTypeElement","values":[{"value":"Values:","desc":"Description"},{"value":"elementRef","desc":"This is a field in the lookup view which returns the element which describes the node type. The values which the lookup returns for the nodeType, have to be element names from the associated hierarchy view (@ObjectModel.dataCategory: #HIERARACHY).\nCaution\nConsumption.filter.defaultHierarchyNode.nodeType is an element name which describes the node type."}],"meaning":"This annotation has to reference a field in the lookup entity, which returns the node types. In Consumption.derivation either resultElement or resultHierarchyNode can be used.\nA chargeable node is a node with node type equal to the element.\nExample\n1000/4711 is a costcenter which has further costcenters as children.\nThere is the need to distinguish between the node (a set of all its leaves) and the pure leaf. \nIf the selected value for Consumption.derivation.resultHierarchyNode.nodeTypeElement is initial, then the leaf will be addressed. \nIf the value is equal to the element, for which it is used, then the node will be addressed. If there is no node with such a name, then the leaf is addressed.\nExample\nIf the selected record from the lookup entity is equal to (nodeTypeElement, controllingArea, costCenter) = (space, 1000, 4711) means always the leaf. While (costCenter, 1000, 4711) means the node. If this does not exist, then it is interpreted as a leaf.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopeInherited":true,"scopes":["ELEMENT","PARAMETER"],"id":"Consumption_derivation_resultHierarchyNode_nodeTypeElement","fr":"Dérivation de nœuds de hiérarchie : élément donnant le type de nœud.","kwFr":["dérivation","nœud de hiérarchie","type de nœud"],"kwEn":["derivation","hierarchy node type"],"usages":["derive","hier"]},{"domain":"Consumption","name":"Consumption.derivation.resultHierarchyNode.mapping","values":[{"value":"Array of:","desc":"Description"},{"value":"hierarchyElement : elementRef","desc":""},{"value":"lookupElement: elementRef","desc":""}],"meaning":"The view defined in look "},{"value":"COUNT","desc":"The number of rows is calculated.\nNote\nThe analytic manager allows COUNT only together with Aggregation.referenceElement and exactly one element in this list. Aggregation: { default: #COUNT , referenceElement: <element> } behaves like Aggregation: { default: #SUM, exception: #COUNT_DISTINCT , referenceElement: <element> }."},{"value":"COUNT_DISTINCT","desc":"The number of distinct values is calculated.\nNote\nThe analytic manager allows COUNT_DISTINCT only together with Aggregation.referenceElement and exactly one element in this list. Aggregation: { default: #COUNT_DISTINCT , referenceElement: <element> } behaves like Aggregation: { default: #SUM, exception: #COUNT_DISTINCT , referenceElement: <element> }."},{"value":"FORMULA","desc":"The value FORMULA indicates that the element is a formula. This has to be calculated after the operands have been determined by aggregation or calculation. It should never be aggregated. \nNote\nThis can only be used in views with Analytics.query: true. \nExample\nMargin : = Revenue / Cost. If Margin should be shown per OrgUnit in a report, the aggregates of Revenue and Cost have to be determined per OrgUnit first, and then the Margin has to be calculated per OrgUnit."},{"value":"NONE","desc":"This value indicates that the element is not a measure. Usually these elements are used in filters and GROUP BY statements."}],"meaning":"","engine":"This annotation will be interpreted by the analytic manager. Use all values for this anntotation only for fields of numeric type. Exception is NONE: It has to be used for all strings like elements.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Aggregation_default","fr":"Agrégation standard d’une mesure (SUM, MIN, MAX, AVG, COUNT, COUNT_DISTINCT, FORMULA, NONE).","kwFr":["agrégation","somme","mesure","indicateur","moyenne","comptage"],"kwEn":["default aggregation","sum","measure","key figure"],"usages":["agg","model"]},{"domain":"Aggregation","name":"Aggregation.exception","values":[{"value":"SUM, MAX, MIN, AVG, COUNT, COUNT_DISTINCT","desc":"All these values determine the aggregation of the measure in the same way as SUM, MAX, MIN, AVG, COUNT, COUNT_DISTINCT in Aggregation.default."},{"value":"FIRST, LAST","desc":"These values indicate that the first or last value in relation to the reference characteristic is shown in the result line."},{"value":"STANDARD_DEVIATION","desc":"This value indicates that, after aggregating with the reference characteristic, the standard deviation of the calculated values is shown in the results row."},{"value":"VARIANCE","desc":"This value indicates that, after aggregating with the reference characteristic, the variance of the calculated values is shown in the results row."},{"value":"MEDIAN","desc":"This value indicates that the middle value (central value) of a set sorted in ascending order is calculated:\nFor a set with an uneven number of elements, the result is the middle value.\nExample\nFor a set of five elements, the result is the value of the third element. Suppose you have the following values: 1, 12, 2, 4, 24. When the values are sorted in ascending order (1, 2, 4, 12, 24), the median is the third middle value, which is 4.\nFor a set with an even number of elements, the result is the average of the two middle values.\nExample\nFor a set of six elements, the result is the average of the third and fourth elements. Suppose you have the following values: 1, 12, 2, 4, 24, 6. When the values are sorted in ascending order (1, 2, 4, 6, 12, 24), the median is the average of the values 4 and 6, which is 5."},{"value":"NHA","desc":"No aggregation along the hierarchy. This value ensures that nodes with a postable value part, and which only aggregate the values of their children, are calculated as NULL. This means they have no value if they are not postable nodes."}],"meaning":"Exception aggregation is always performed in addition to default aggregation, which must not be be equal to #NONE. This is not an alternative to default aggregation. This means that data is first aggregated through the default aggregation grouped by the reference elements, and then aggregated with the exception aggregation.\nNote\nIf you want to use Aggregation.exception, you have to define Aggregation.default (not equal to NONE) and Aggregation.referenceElement in order to define the granularity with which the aggregation rule is applied.","engine":"This annotation will be interpreted by the analytic manager.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Aggregation_exception","fr":"Agrégation d’exception appliquée en plus de l’agrégation standard (ex. dernière valeur, moyenne).","kwFr":["agrégation d’exception","dernière valeur","stock","moyenne"],"kwEn":["exception aggregation","last value","stock"],"usages":["agg"]},{"domain":"Aggregation","name":"Aggregation.referenceElement","values":[{"value":"array of ElementRef","desc":"You can specify a reference characteristic."}],"meaning":"In views of dataCategory: #CUBE or #DIMENSION you can use exactly one element. In analytic queries (Analytics.query: true) you can use up to five elements. The elements in the list cannot be measures.","engine":"This annotation will be interpreted by the analytic manager.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Aggregation_referenceElement","fr":"Caractéristique(s) de référence pour l’agrégation d’exception ou le comptage.","kwFr":["élément de référence","caractéristique de référence","comptage"],"kwEn":["reference element","count"],"usages":["agg"]},{"domain":"Hierarchy","name":"Hierarchy.parentChild.directory","values":[{"value":"associationRef","desc":"Name of the hierarchy directory that is used to filter the nodes"}],"meaning":"For external hierarchies, the view of hierarchy nodes often contains the nodes for multiple alternative hierarchies. A user is supposed to choose a single hierarchy for display, and his/her selection is used as a filter when selecting from the hierarchy node view. The directory annotation identifies an association, the hierarchy directory association, from the hierarchy node view to a view (the so-called hierarchy directory), providing all available alternative hierarchies for this hierarchy node view.","engine":"Analytic manager: The hierarchy directory is used as user input help, and a chosen hierarchy directory entry is used to filter the nodes via the hierarchy directory association.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Hierarchy_parentChild_directory","fr":"Association vers le répertoire des hiérarchies (plusieurs hiérarchies alternatives).","kwFr":["hiérarchie","répertoire","hiérarchie externe","alternative"],"kwEn":["hierarchy directory"],"usages":["hier"]},{"domain":"Hierarchy","name":"Hierarchy.parentChild.label","values":[{"value":"String","desc":"Description of the hierarchy."}],"meaning":"User-friendly name of the hierarchy.","engine":"Analytic manager: This name can be exposed in input help for Hierarchy.parentChild.name. Values (optional):","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Hierarchy_parentChild_label","fr":"Libellé de la hiérarchie.","kwFr":["hiérarchie","libellé"],"kwEn":["hierarchy label"],"usages":["hier","text"]},{"domain":"Hierarchy","name":"Hierarchy.parentChild.multipleParents","values":[{"value":"Boolean (true, false)","desc":"Defines whether multiple parents occur in the hierarchy or not.\nDefault: true"}],"meaning":"Indicates that multiple parents might occur in the hierarchy. \nNote\nIn a geographic hierarchy for example, you might want to assign the country Turkey to the continents Europe and Asia. \nCaution\nWe need to distinguish the above use case from the following one: In a time hierarchy YEAR, QUARTER, MONTH January under 2011 and January under 2012 are not the same member with multiple parents. They are di ate property is calculated in a BOPF property determination (dynamic field control).","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_createEnabled","fr":"Autorise la création d’instances (BOPF).","kwFr":["création","transactionnel","BOPF"],"kwEn":["create enabled"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.dataCategory","values":[{"value":"#TEXT","desc":"Indicates that the annotated entity represents texts. Usually one key element is of type language. \nNOTE: Within the VDM a text view is always language-dependent."},{"value":"#HIERARCHY","desc":"Indicates that the entity represents the hierarchy-related data. This could be a header information or structure information."}],"meaning":"Defines the category of data that is represented by the below-mentioned values.","engine":"In ABQL joins between a Data- and a Text entity without explicit language key handling will be interpreted as a 1 : (0,1) association, where the language key is defaulted with the logon language.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_dataCategory","fr":"Catégorie de données de la vue : texte ou hiérarchie.","kwFr":["vue de texte","vue de hiérarchie","catégorie"],"kwEn":["data category","text view","hierarchy view"],"usages":["text","hier","model"]},{"domain":"ObjectModel","name":"ObjectModel.deleteEnabled","values":[],"meaning":"If this annotation has value true, it is allowed to delete existing instances.","engine":"SADL: Exposes this information BOPF: Rejects delete requests that do not provide a value true for this field (in case of static field control). With the value 'EXTERNAL_CALCULATION', the delete property is calculated in a BOPF property determination (dynamic field control).","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_deleteEnabled","fr":"Autorise la suppression d’instances (BOPF).","kwFr":["suppression","transactionnel" ty (no modifying roundtrips to the draft document), after that the processor has to be removed.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_processor_expiryBehavior","fr":"Draft partagé : comportement d’expiration du processeur.","kwFr":["draft","expiration","processeur"],"kwEn":["draft processor expiry"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.processor.expiryInterval","values":[],"meaning":"The duration interval can be specified by the annotation lifecycle.processor.expiryInterval in order to overrule the default duration. The value must be compliant to the dayTimeDuration format.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_processor_expiryInterval","fr":"Draft partagé : durée avant expiration du processeur.","kwFr":["draft","expiration","durée"],"kwEn":["processor expiry interval"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.processor.notificationBeforeExpiryInterval","values":[],"meaning":"To notify the draft processor in advance before the expiration takes place, a notification will be send. The default warning interval can be overruled by the help of annotation notificationBeforeExpiryInterval. The value must be compliant to the dayTimeDuration format.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_processor_notificationBeforeExpiryInterval","fr":"Draft partagé : délai de notification avant expiration du processeur.","kwFr":["draft","notification","expiration"],"kwEn":["notification before expiry"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.enqueue.expiryBehavior","values":[],"meaning":"The creation of an exclusive draft related to an existing active document causes an exclusive durable lock of the active document. The lifecycle.enqueue.* annotations allow to overrule the global defaults for the durable lock expiration handling. After a certain period of time, the durable exclusive lock on the active document has to be released. This period of time is defined by the expiration behavior. \nEnqueue Expiration Behavior: \nRELATIVE_TO_ENQUEUE_START - The period of time starts from the point in time the exclusive durable lock has been initially acquired. \nRELATIVE_TO_LAST_CHANGE - The interval describes the period of inactivity (no modifying roundtrips to the draft document), after that the exclusive durable lock has to be removed","engine":"The lifecycle services automatically unlock active documents accordingly to the defined enqueue expiration behavior.","type":"","notes":["Nom corrigé : le document source indique « ObjectModel.lifecle.enqueue.expiryBehavior »."],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_enqueue_expiryBehavior","fr":"Draft : comportement d’expiration du verrou durable sur le document actif.","kwFr":["draft","verrou durable","expiration"],"kwEn":["durable lock expiry"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.enqueue.expiryInterval","values":[],"meaning":"Using this annotation, you can specify an interval to overrule the default duration. \nThe value must be compliant to the dayTimeDuration format (http://www.w3.org/TR/xmlschema11-2/#dayTimeDuration).","engine":"","type":"","notes":["Nom corrigé : le document source indique « ObjectModel.lifecle.enqueue.expiryInterval »."],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_enqueue_expiryInterval","fr":"Draft : durée du verrou durable.","kwFr":["draft","verrou durable","durée"],"kwEn":["durable lock interval"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.enqueue.notificationBeforeExpiryInterval","values":[],"meaning":"To notify the draft processor in advance before the expiration takes place, a notification will be send. The default warning interval can be overruled by the help of annotation notificationBeforeExpiryInterval using the valid dayTimeDuration format (http://www.w3.org/TR/xmlschema11-2/#dayTimeDuration).","engine":"","type":"","notes":["Nom corrigé : le document source indique « ObjectModel.lifecle.enqueue.notificationBeforeExpiryInterval »."],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_enqueue_notificationBeforeExpiryInterval","fr":"Draft : notification avant expiration du verrou durable.","kwFr":["draft","verrou","notification"],"kwEn":["lock notification"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.processing.expiryBehavior","values":[],"meaning":"After the durable lock expiration phase has been processed for an exclusive draft, the durable lock of its active document is released. However for draft-aware applications it is still not allowed to create a new draft related to the same active document until the processing of the existing draft is expired. \nThe lifecycle.processing.* annotations allow to overrule the global defaults for the draft processing expiration handling. After a certain period of time, the processor is removed from an exclusive draft and a different user is allowed to create a new draft related to the same active document. In that case, the first draft is deleted. Otherwise, the editing for the first draft can be continued at a later point in time.\nThe default processing expiration settings can be overruled like the lifecycle.enqueue.* annotations by the help of a behavior, duration interval and notification interval.","engine":"The lifecycle services automatically set the processing status of a draft accordingly to the defined processing expiration behavior.","type":"","notes":["Nom corrigé : le document source indique « ObjectModel.lifecle.processing.expiryBehavior »."],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_processing_expiryBehavior","fr":"Draft : comportement d’expiration de la phase de traitement.","kwFr":["draft","traitement","expiration"],"kwEn":["processing expiry"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.processing.expiryInterval","values":[],"meaning":"Using this annotation, you can specify an interval to overrule the default duration interval.","engine":"","type":"","notes":["Nom corrigé : le document source indique « ObjectModel.lifecle.processing.expiryInterval »."],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_processing_expiryInterval","fr":"Draft : durée de la phase de traitement.","kwFr":["draft","traitement","durée"],"kwEn":["processing interval"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.processing.notificationBeforeExpiryInterval","values":[],"meaning":"Using this annotation, you can specify an interval to overrule the default notification interval.","engine":"","type":"","notes":["Nom corrigé : le document source indique « ObjectModel.lifecle.processing.notificationBeforeExpiryInterval »."],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_processing_notificationBeforeExpiryInterval","fr":"Draft : notification avant expiration de la phase de traitement.","kwFr":["draft","traitement","notification"],"kwEn":["processing notification"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.draft.expiryBehavior","values":[],"meaning":"To comply to data privacy policies and the deletion of personal data, drafts have to be deleted after a certain period if they are not processed any more. The default expiration timeframe is 28 days. The lifecycle.draft. annotations allow to overrule the global defaults for the draft expiration handling. After a certain period of time, the draft document has to be deleted. This period of time is defined by the expiry behavior. \nRELATIVE_TO_ENQUEUE_START : The period of time starts from the point in time the draft document has been initially created.\nRELATIVE_TO_LAST_CHANGE : The interval describes the period of inactivity (no modifying roundtrips to the draft document), after that the draft document has to be removed.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_draft_expiryBehavior","fr":"Draft : suppression des brouillons non traités (défaut 28 jours, protection des données).","kwFr":["draft","brouillon","suppression","RGPD","28 jours"],"kwEn":["draft expiry","deletion"],"usages":["trans","privacy"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.draft.expiryInterval","values":[],"meaning":"Using this annotation, you can overrule the default duration. The value must be compliant to the dayTimeDuration format.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_draft_expiryInterval","fr":"Draft : durée de conservation des brouillons.","kwFr":["draft","brouillon","durée"],"kwEn":["draft expiry interval"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.lifecycle.draft.notificationBeforeExpiryInterval","values":[],"meaning":"To notify the draft processor in advance before the expiration takes place, a notification will be send. The default warning interval can be overruled using this annotation. The value must be compliant to the dayTimeDuration format.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_lifecycle_draft_notificationBeforeExpiryInterval","fr":"Draft : notification avant suppression du brouillon.","kwFr":["draft","brouillon","notification"],"kwEn":["draft notification"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.mandatory","values":[],"meaning":"Defines that element is mandatory\nIf this annotation has the value true, the field must be filled by the consumer when executing a modification. \nWith the value 'EXTERNAL_CALCULATION', you have the option to specify on which conditions the element is defined as mandatory (dynamic field control). The mandatory property is in this case calculated in a property determination of the corresponding business object’s node.","engine":"SADL: Exposes this information BOPF: The evaluation runtime rejects modifications that do not provide a value for the annotated field. However, BOPF does not automatically check for the mandatory property. For this purpose, it is required that you add a validation to the corresponding business object’s node and configure it as a consistency validation for checking mandatory properties (usually with the trigger condition for Create and Update). For implementation of the consistency validation, you can use the library class /BOBF/CL_LIB_V_MANDATORY_ATTR, or your own implementation in case this class should not fit to your needs.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"ObjectModel_mandatory","fr":"Champ obligatoire à la modification (BOPF).","kwFr":["obligatoire","champ requis","saisie"],"kwEn":["mandatory field"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.modelCategory","values":[{"value":"#BUSINESS_OBJECT","desc":"View that represents a BOPF business object"}],"meaning":"Each business object can semantically be categorized using this object model setting","engine":"The model category must not have any runtime effect but is used for a semantic grouping, for example in view browsers.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_modelCategory","fr":"Catégorise la vue comme objet métier.","kwFr":["objet métier","catégorie de modèle"],"kwEn":["model category","business object"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.readOnly","values":[],"meaning":"If this annotation has the value true, the field must not be updated by the consumer.","engine":"SADL: Exposes this information BOPF: Rejects modifications when updating fields that are defined as @ObjectModel.readOnly: true (in case of static field control). With the value 'EXTERNAL_CALCULATION', the readonly property is calculated in a BOPF property determination (dynamic field control).","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"ObjectModel_readOnly","fr":"Champ en lecture seule pour le consommateur.","kwFr":["lecture seule","non modifiable"],"kwEn":["read only"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.representativeKey","values":[],"meaning":"Most specific element (field or managed association) of the primary key (indicated by the keyword KEY) that represents the entity which the view is based on. This element shall be used as the anchor for defining foreign key relationships (except for text views): The foreign key field corresponding to the representative key represents the entity. As such it can be called representative foreign key element. The foreign key association is defined on the representative foreign key element. The name of the representative key typically equals the name of the entity represented by the view.\nFor non-text views it is the key element for which the view serves as a value list/check table. For text views (@ObjectModel.dataCategory: #TEXT) it identifies the key element to which the text fields relate to.\nThe representative key element has to be modelled explicitly even if there is only one primary key field (no implicit derivation). \nA view may only become a target of a foreign key association if it has a representative key element (exception: language dependent text views may not be used as targets of foreign key relationships)","engine":"Analytic Manager: In analytics, both the grouping by the entity and the hierarchical representation of the entity are handled using the representative foreign key field.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_representativeKey","fr":"Élément clé représentatif de l’entité : ancre des clés étrangères (dimensions, textes).","kwFr":["clé représentative","clé","dimension","ancre"],"kwEn":["representative key"],"usages":["keys","model"]},{"domain":"ObjectModel","name":"ObjectModel.semanticKey[ ]","values":[],"meaning":"Identifies an instance of an entity from business perspective using human-readable field values. It does neither contain time-/language-dependent nor other technical components (for example: draft indicator). Thus it may be ambiguous resulting in multiple selected records/instances of a view that may need to be filtered using contextual information (for example: current date, preferred language). \nFor a given entity, only a single semantic key is defined.","engine":"UI: Uses semantic key for bookmarking and navigation.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_semanticKey","fr":"Clé sémantique : identifie l’instance par des champs lisibles métier.","kwFr":["clé sémantique","clé métier","identifiant lisible"],"kwEn":["semantic key","business key"],"usages":["keys","odata"]},{"domain":"ObjectModel","name":"ObjectModel.text.association","values":[],"meaning":"Defines the associated view (annotated with @ObjectModel.dataCategory: #TEXT), which provides textual descriptions for the annotated field. \nNOTE: The usage of this annotation excludes the usage of @ObjectModel.text.element.","engine":"SADL - Enriches the OData entity type of the view with the textual description of the target view applying an automated language filtering. The name of the auto-generated text property will be composed out of the annotated field name and the constant suffix _Text. This OData property is mapped onto the first text field of the associated target CDS view annotated with @Semantics.text:true. Analytic Manager - Uses the associated view as TEXT view for annotated field.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"ObjectModel_text_association","fr":"Association vers la vue de textes (dépendants de la langue) du champ.","kwFr":["texte","libellé","description","association de texte","langue"],"kwEn":["text association","description","language dependent"],"usages":["text","keys"]},{"domain":"ObjectModel","name":"ObjectModel.text.element[ ]","values":[],"meaning":"Establishes the conjunction of a field with its descriptive language-independent texts.\nNOTE: The usage of this annotation excludes the usage of @ObjectModel.text.association.","engine":"SADL - First text field listed in the annotation array will be handled as descriptive text of the annotated field in OData exposure scenarios.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"ObjectModel_text_element","fr":"Lie un champ à son élément de texte (indépendant de la langue) dans la même vue.","kwFr":["texte","libellé","description","élément texte"],"kwEn":["text element","description"],"usages":["text"]},{"domain":"ObjectModel","name":"ObjectModel.transactionalProcessingDelegated","values":[],"meaning":"Indicates that transactional accesses to the view are delegated to the transactional runtime of the underlying view (which is annotated with @ObjectModel.transactionalProcessingEnabled:true). It may only be defined on root view level (@ObjectModel.compositionRoot:true).","engine":"SADL: Uses the information to delegate requests to the transactional runtime","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_transactionalProcessingDelegated","fr":"Délègue le traitement transactionnel à la vue sous-jacente.","kwFr":["transactionnel","délégation","BOPF"],"kwEn":["transactional processing delegated"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.updateEnabled","values":[],"meaning":"If this annotation has value true, it is allowed to update existing instances.","engine":"SADL: Exposes this information BOPF: Rejects modification requests that do not provide a value true for this field (in case of static field control). With the value 'EXTERNAL_CALCULATION', the update property is calculated in a BOPF property determination (dynamic field control).","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_updateEnabled","fr":"Autorise la modification d’instances (BOPF).","kwFr":["modification","mise à jour","BOPF"],"kwEn":["update enabled"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.usageType.sizeCategory","values":[],"meaning":"The size category enables the consumer of a service to estimate the possible results set. It reflects the set of data that has to be searched through to compute, for example, the number of rows in the results set by using a count(*) function in a CDS view. \nYou can assign one of the following size categories, which specifies the expected number of data sets (rows) in a production customer system: \nS: < 1000\nM: < 100.000\nL: < 10.000.000\nXL: < 100.000.000\nXXL: >= 100.000.000","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_usageType_sizeCategory","fr":"Volumétrie attendue de la vue (S, M, L, XL, XXL).","kwFr":["volumétrie","taille","nombre de lignes","performance"],"kwEn":["size category","volume"],"usages":["perf"]},{"domain":"ObjectModel","name":"ObjectModel.usageType.serviceQuality","values":[],"meaning":"This annotation reflects the quality of the service that results from the CDS view. Using this annotation, the consumer is able to decide whether or not the annotated CDS view fits the demanded response time and the throughput requirements. \nEach CDS view can be assigned to one of the following quality categories: \nA: The annotated CDS view may be consumed within the business logic for high volume transactions or in background processing.\nB: The annotated CDS view may be consumed within business logic for transactions or in background processing.\nC: The annotated CDS view may be consumed from the UI in transactions for single object retrieval.\nD: The annotated CDS view may be consumed in analytical reporting.\nX: The annotated CDS view is used to push down the application’s code to SAP HANA DB.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_usageType_serviceQuality","fr":"Qualité de service attendue (temps de réponse, débit).","kwFr":["qualité de service","performance","temps de réponse"],"kwEn":["service quality","performance"],"usages":["perf"]},{"domain":"ObjectModel","name":"ObjectModel.usageType.dataClass","values":[],"meaning":"To support the decision on cache strategies for higher layers and to enable client-side statement routing using these caches, each CDS view can be assigned to a data class (@ObjectModel.usageType.dataClass). \nThe different data classes correspond with different life time cycles:\nTRANSACTIONAL data: The CDS view provides data that is written or changed in high volume transactions or in background processing. Examples: Header or items for sales order processing or financial bookings. \nMASTER data is read or changed but not written in high volume transactions or in background processing. This data typically drives the business process decisions when business logic is executed. It is also displayed to the end user as context information or to enable user decisions when the transactions are executed manually. Examples are material data, business partner data, or account data. \nORGANIZATIONAL data describes the organizational structure of a company and its business processes. You can consider it as a special kind of MASTER data. Examples are sales unit, distribution channel and cost center.\nCUSTOMIZING data describes how a concrete business process is executed in a customer system landscape. This data typically consists of a content that is delivered by SAP and added to by the customer. Examples are countries, units of measures, and currencies.\nMETA data classes either specify how the system is configured or describes the technical structure of entities. Typically, this type of data is part of content that is shipped to customers. Examples are DDIC structures, field controls, and authorization objects.\nMIXED data classes should be used if the annotated CDS view contains tables with data that represents multiple data classes.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_usageType_dataClass","fr":"Classe de données (master, transactional, customizing…) pour les stratégies de cache.","kwFr":["classe de données","données de base","mouvements","paramétrage","cache"],"kwEn":["data class","master","transactional","customizing"],"usages":["perf"]},{"domain":"ObjectModel","name":"ObjectModel.writeActivePersistence","values":[],"meaning":"Defines the DDIC database table name of the active view. This requires @ObjectModel.transactionalProcessingEnabled: true","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_writeActivePersistence","fr":"Table DDIC de persistance des données actives (BOPF).","kwFr":["persistance","table active","BOPF"],"kwEn":["active persistence"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.writeDraftPersistence","values":[],"meaning":"Defines the DDIC database table name of the draft data. This requires @ObjectModel.transactionalProcessingEnabled: true","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_writeDraftPersistence","fr":"Table DDIC de persistance des brouillons (BOPF).","kwFr":["persistance","table draft","brouillon"],"kwEn":["draft persistence"],"usages":["trans"]},{"domain":"ObjectModel","name":"ObjectModel.writeEnabled","values":[],"meaning":"Enables the transactional runtime support. It may only be defined on root view level (@ObjectModel.compositionRoot: true).\nCaution\nDo not use this annotation an more! It is replaced by ObjectModel.transactionalProcessingEnabled.","engine":"BOPF - Depending on the specified persistence information, we can distinguish between the folllowing scenarios: a) writeActivePersistence: Active data (defined by that CDS view) is directly modified by the transactional runtime (without having any kind of draft). b) writeDraftPersistence: Active data (defined by that CDS view) is only indirectly modified by a draft. c) writeActivePersistence & writeDraftPersistence: Both the draft and the active data are written by the transactional runtime.","type":"","notes":["Marquée « Deprecated » dans le document source."],"deprecated":true,"groupDesc":"","scopes":["VIEW"],"id":"ObjectModel_writeEnabled","fr":"Ancienne activation du runtime transactionnel : remplacée par transactionalProcessingEnabled.","kwFr":["obsolète","transactionnel","BOPF"],"kwEn":["deprecated","write enabled"],"usages":["trans"]},{"domain":"OData","name":"OData.publish","values":[{"value":"true","desc":"Has to be set to generate an OData service"},{"value":"false","desc":"Defines that this CDS entity cannot be exposed for an OData service"}],"meaning":"OData.publish is intended for generating an OData service.","engine":"SADL - Generates the OData service","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW","TABLE_FUNCTION"],"id":"OData_publish","fr":"Génère automatiquement un service OData à partir de la vue.","kwFr":["OData","service","publication","Fiori","Gateway"],"kwEn":["OData publish","service"],"usages":["odata"]},{"domain":"Semantics","name":"Semantics.address.type[ ]","values":[{"value":"HOME","desc":"Home address"},{"value":"WORK","desc":"Work address"},{"value":"PREF","desc":"Preferred address\nDefault"},{"value":"OTHER","desc":"Other address"}],"meaning":"","engine":"SADL: Translates CDS annotations into the corresponding OData annotations (Exception: Semantics.address.number and Semantics.address.streetNoNumber)","type":"String(10)","notes":[],"d
