<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotations CDS – recherche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de travail quotidien, précis et calme, comme un index de manuel de référence.
   IDEA: l'index analytique d'un ouvrage technique — on cherche par mot, on tombe sur la fiche.
   PICTURE: l'outil lui-même : barre de recherche, liste de résultats, fiche détaillée.
   COLOUR and TYPE: blanc, encre #14110f, outremer #1d2bd8 ; nuit #0d0e18. Spectral (titres) + Inter, mono pour le code.
   LAYOUT: thèmes à gauche, résultats au centre, fiche à droite ; empilé sous 1000px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d0e18);--panel:light-dark(#f6f7f9,#151726);--ink:light-dark(#14110f,#e9e9f1);
--mute:light-dark(#5f6370,#a3a7b8);--line:light-dark(#e2e4ea,#272a3d);--acc:light-dark(#1d2bd8,#9aa2ff);
--accbg:light-dark(#eef0ff,#1b1f45);--add:light-dark(#8a4b00,#f2b866);--addbg:light-dark(#fff6e8,#2a2112);
--code:light-dark(#f3f4f8,#10121f);--warn:light-dark(#9b1c1c,#ff9b9b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
code{overflow-wrap:anywhere}pre{overflow-x:auto;margin:0}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{padding:22px max(3vw,16px) 14px;border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font-size:clamp(24px,3vw,34px)}
.meta{color:var(--mute);font-size:13px}
.search{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{flex:1 1 360px;font-size:17px;padding:12px 16px;border:2px solid var(--acc);border-radius:10px;background:var(--bg);min-height:48px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:light-dark(#fff,#0d0e18)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute);align-items:center}
.tag{display:inline-block;font-size:12px;border-radius:5px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
.tag.src{border-color:var(--mute)}
.tag.add{border:1px dashed var(--add);color:var(--add);background:var(--addbg)}
.tag.sc{background:var(--accbg);border-color:transparent;color:var(--acc)}
.tag.dep{color:var(--warn);border-color:var(--warn)}
main{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(0,1.25fr);gap:0;min-height:70vh}
aside{border-right:1px solid var(--line);padding:14px 14px 30px;font-size:14px}
aside summary{cursor:pointer;font-weight:600;padding:6px 0;min-height:32px}
aside h3{font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:5px 10px;cursor:pointer;font-size:13px;text-align:left;min-height:32px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:light-dark(#fff,#0d0e18)}
.chip small{opacity:.7;margin-left:3px}
.ck{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;cursor:pointer}
.reset{margin-top:14px;border:0;background:none;color:var(--acc);cursor:pointer;padding:6px 0;text-decoration:underline}
#list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 40px);position:sticky;top:0}
.count{padding:10px 16px;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 16px;cursor:pointer}
.item:hover{background:var(--panel)}.item[aria-current=true]{background:var(--accbg);box-shadow:inset 3px 0 0 var(--acc)}
.item .n{font-family:"JetBrains Mono",monospace;font-size:13.5px;font-weight:500;color:var(--acc);overflow-wrap:anywhere}
.item .f{font-size:14px;margin-top:2px}
.item .m{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
mark{background:light-dark(#ffe58a,#5b4a00);color:inherit;border-radius:2px}
#detail{padding:20px clamp(16px,2.4vw,32px) 60px;overflow:auto;max-height:calc(100vh - 40px);position:sticky;top:0}
.dh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.dh h2{font-family:"JetBrains Mono",monospace;font-size:clamp(17px,1.8vw,21px);font-weight:500;overflow-wrap:anywhere;color:var(--acc)}
.btn{border:1px solid var(--acc);color:var(--acc);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--accbg)}
.sec{margin-top:18px}
.sec>h3{font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box{border-radius:10px;padding:12px 14px}
.box.add{background:var(--addbg);border:1px dashed var(--add)}
.box.src{background:var(--panel);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:13px}
td:first-child{white-space:nowrap;font-family:"JetBrains Mono",monospace;font-size:13px}
.codewrap{position:relative;background:var(--code);border:1px solid var(--line);border-radius:10px}
.codewrap pre{padding:14px 84px 14px 14px;font-size:13px;line-height:1.5}
.codewrap .btn{position:absolute;top:8px;right:8px;min-height:32px;padding:4px 10px}
.text{white-space:pre-line}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{font-family:"JetBrains Mono",monospace;font-size:12.5px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--acc);text-align:left}
.empty{color:var(--mute);padding:30px 16px}
.cards{padding:18px max(3vw,16px) 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.card h2{font-size:21px}
.card .en{color:var(--mute);font-size:13px}
.note{font-size:13px;color:var(--mute)}
.note li{margin:3px 0}
#view-scen,#view-dom{grid-column:1/-1}
.back{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);padding:16px max(3vw,16px);font-size:13px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:1100px){main{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}aside{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
 aside .fold{display:block}}
@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}#list,#detail{max-height:none;position:static;border-right:0}
 #detail{display:none}body.showdetail #detail{display:block}body.showdetail #list,body.showdetail aside{display:none}
 .back{display:inline-block;margin-bottom:12px}td:first-child{white-space:normal}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Annotations CDS : trouver la bonne annotation par usage</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher : devise, filtre obligatoire, delta, texte, hiérarchie, F4…" autocomplete="off" aria-label="Rechercher une annotation">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-ann" aria-selected="true" data-v="ann">Annotations</button>
      <button role="tab" id="t-scen" aria-selected="false" data-v="scen">Scénarios</button>
      <button role="tab" id="t-dom" aria-selected="false" data-v="dom">Domaines</button>
    </div>
  </div>
  <div class="legend">
    <span><span class="tag src">Source</span> extrait du document SAP fourni (anglais)</span>
    <span><span class="tag add">Ajout</span> rédigé pour cet outil (FR/EN), à relire</span>
    <span>Raccourcis : <kbd>/</kbd> rechercher · <kbd>↑</kbd><kbd>↓</kbd> naviguer</span>
  </div>
</header>

<main id="view-ann">
  <aside id="facets"></aside>
  <section id="list" aria-label="Résultats"></section>
  <section id="detail" aria-live="polite"></section>
</main>
<section id="view-scen" hidden></section>
<section id="view-dom" hidden></section>

<footer id="foot"></footer>
<div class="toast" id="toast">Copié</div>

<script id="data" type="application/json">{"meta":{"source":"CDS_Annotations.docx (extrait de help.sap.com, ABAP Platform, version 202510.002)","target":"SAP S/4HANA Cloud Private Edition 2025 (ABAP Platform 2025, SAP_BASIS 816)","built":"2026-11-22","version":"V1"},"usages":{"auth":{"fr":"Autorisations & sécurité","en":"Authorization & security"},"privacy":{"fr":"Données personnelles / RGPD","en":"Personal data / GDPR"},"extract":{"fr":"Extraction & delta (BW, Datasphere)","en":"Extraction & delta"},"model":{"fr":"Modèle analytique (cube, dimension, fait)","en":"Analytical model"},"query":{"fr":"Requête analytique","en":"Analytical query"},"filter":{"fr":"Filtres, paramètres & variables","en":"Filters, parameters & variables"},"derive":{"fr":"Dérivation & valeurs par défaut","en":"Derivation & defaults"},"vh":{"fr":"Aide à la saisie (F4)","en":"Value help"},"agg":{"fr":"Agrégation & calculs","en":"Aggregation & calculations"},"hier":{"fr":"Hiérarchies","en":"Hierarchies"},"display":{"fr":"Affichage analytique","en":"Analytical display"},"planning":{"fr":"Planification","en":"Planning"},"text":{"fr":"Textes & libellés","en":"Texts & labels"},"amount":{"fr":"Montants, devises & quantités","en":"Amounts, currencies & quantities"},"time":{"fr":"Dates, temps & périodes","en":"Dates, time & periods"},"contact":{"fr":"Adresses, personnes & contacts","en":"Addresses, persons & contacts"},"keys":{"fr":"Clés & associations","en":"Keys & associations"},"trans":{"fr":"Transactionnel & draft (BOPF)","en":"Transactional & draft (BOPF)"},"perf":{"fr":"Performance & volumétrie","en":"Performance & sizing"},"search":{"fr":"Recherche","en":"Search"},"odata":{"fr":"Exposition OData / Fiori","en":"OData / Fiori exposure"},"vdm":{"fr":"VDM & gouvernance","en":"VDM & governance"}},"domains":[{"domain":"AccessControl","description":"Enable application developers to define how the authorization check for a CDS entity is executed","definition":"@Scope:[#RELEASED_FOR_KEY_USER_APPS, #RELEASED_FOR_SAP_CLOUD_PLATFORM] \nannotation AccessControl\n {\n   authorizationCheck : String(20) enum { NOT_REQUIRED; NOT_ALLOWED; MANDATORY; CHECK; PRIVILEGED_ONLY; } default #NOT_REQUIRED;\n   privilegedAssociations: array of AssociationRef;\n   personalData\n   {\n      blocking : String(30) enum { NOT_REQUIRED; REQUIRED; BLOCKED_DATA_INCLUDED; BLOCKED_DATA_EXCLUDED; };   \n      blockingIndicator : array of ElementRef;\n   };\n };","after":"NOTE \nThe value #NOT_REQUIRED is recommended for entities for which no authorization checks are planned yet, but might be needed by the developer or customer later. To prohibit roles for the entity, use the value #NOT_ALLOWED.\nExamples\nExample 1\nWhen the developer activates the following DDL document, since an authorization check isn’t required, ABAP development tools don’t produce a warning. It doesn’t matter whether a role exists for the entity or not.\nAt runtime, if there’s a role for entity, then ABAP performs an authorization check with the role. If there’s no role, there’s no check and no protection for the entity.\nSample Code\n@AbapCatalog.sqlViewName: 'DEMO_CDS_PRJCTN'\n@AccessControl.authorizationCheck: #NOT_REQUIRED\ndefine view  demo_cds_spfli\n  as select from spfli\n     { key spfli.carrid,\n       key spfli.connid,\n       spfli.cityfrom,\n       spfli.cityto }\nExample 2\nSample Code\n@AbapCatalog.sqlViewName: 'Z_MBB_SQL_SOI'\n@AccessControl.authorizationCheck: #NOT_REQUIRED\n@AccessControl.personalDataBlocking: #NOT_REQUIRED\n@AccessControl.privilegedAssociation: [“tosalesorder”]\n\ndefine view Z_MBB_CDS_SOI as select from snwd_so_i\n association [1] to sacm_cds_snwd_pd   as toproduct      on product_guid = prod-uct_id \n association [1] to sacm_cds_snwd_so   as tosalesorder   on parent_key = sales_id\n{\nkey node_key as salesitem_id,\nparent_key,\nproduct_guid,\ngross_amount,\ntax_amount,\ntoproduct,        --Association\ntosalesorder      --Association\n}\nExample 3\nThis sample code shows how the annotations for read access logging can be used. \nSample Code\n@AbapCatalog.sqlViewName: 'ZBANK_POSTINGS'\n@Analytics.dataCategory: #CUBE\n@AccessControl.readAccess.logging.output : true\ndefine view Z_BankAccount_Postings\n  as select from I_GLAccountLineItem\n{\n  AccountingDocument,\n  PostingDate,\n  @AccessControl.readAccess.logging.logdomain: { area : 'FINANCE' , domain : 'BANK' }\n  HouseBankAccount,\n  @AccessControl.readAccess.logging.logdomain: { area : 'FINANCE' , domain : 'BANK' }\n  HouseBank,\n  AmountInTransactionCurrency,\n  TransactionCurrency\n}","nAnnotations":5,"fr":"Contrôle d’accès : comment le contrôle d’autorisation (DCL) s’applique à une entité CDS, blocage des données personnelles, journalisation des lectures.","kwFr":"autorisation; sécurité; DCL; rôle; contrôle d’accès","kwEn":"authorization; security; access control; DCL"},{"domain":"Analytics","description":"Enable the Analytic Manager for multidimensional data consumption, performing data aggregation, and slicing and dicing data. BI front ends like Design Studio and Analysis Office can consume the data via the Analytic Manager.","definition":"@Scope:[#VIEW]\nAnnotation Analytics\n {\n   dataCategory : String enum { DIMENSION; FACT; CUBE; AGGREGATIONLEVEL; };\n   dataExtraction\n   {\n      enabled : Boolean default true;\n      delta :\n      {\n         byElement : elementRef;\n         {\n\t\t\tname : RefToElement;\n\t\t\tmaxDelayInSeconds : Integer default 1800;\n\t\t\tdetectDeletedRecords: boolean default true;\n\t\t\tignoreDeletionAfterDays : Integer; \n         };\n\t\t changeDataCapture\n         {\n            automatic : Boolean default true;            \n            mapping\n            {\n               role : String(30) enum {MAIN; LEFT_OUTER_TO_ONE_JOIN;};\n               table : String(30);\n               // only used if association is not specified\n               viewElement : array of ElementRef;\n               // only used if association is not specified\n               tableElement : array of ElementRef;\n               filter : array of \n               {\n                  tableElement : ElementRef;\n                  operator : String(11) enum {EQ;NOT_EQ;GT;GE;LT;LE;BETWEEN;NOT_BETWEEN;} default #EQ;\n                  value : String(45);\n                  highValue : String(45);\n               };\n            };\n         };\n      };\n      filter : array of \n      {\n         viewElement : ElementRef;\n         operator : String(11) enum {EQ;NOT_EQ;GT;GE;LT;LE;BETWEEN;NOT_BETWEEN;} default #EQ;\n         value : String(45);\n         highValue : String(45);\n      };\n   };\n   hidden : Boolean default true;\n   internalName : String(30) enum { DEFAULT; LOCAL; GLOBAL; };\n   planning\n   {\n      enabled : Boolean default true;\n   };\n   query : Boolean default true;\n   settings.maxProcessingEffort : { LOW; MEDIUM; HIGH; UNLIMITED; } default #HIGH;\n   settings.zeroValues.handling: String(20) enum { SHOW; HIDE; HIDE_IF_ALL; } default #SHOW;\n   settings.zeroValues.hideOnAxis: String(20) enum { ROWS; COLUMNS; ROWS_COLUMNS; } default #ROWS_COLUMNS;\n   viewModelReplication.enabled : Boolean default true; \n   writeBack\n   {\n      className : String;\n   };\n };\n@Scope:[#ELEMENT]\nAnnotation Analytics\n {\n   internalName : String(30) enum { DEFAULT; LOCAL; GLOBAL; };   \n };","after":"The Analytic Manager needs a star schema (multidimensional) and a query to consume the data. Most annotations to define the star schema in different CDS views are specified in ObjectModel annotations. The Analytics annotations also specify the facts (center of the star schema), extraction capabilities for replicating data into further systems, and analytic query properties. A semantic distinction can be made in the Analytics annotations between annotations that are relevant for the InfoProvider (CUBE) level and annotations that are only relevant for analytic queries.\n\nExamples\nExample 1 \nExample for replication-enabled master data. \nSample Code\n@EndUserText.label: 'EPM Demo: Employee'\n@Analytics:{ dataCategory: #DIMENSION , dataExtraction.enabled: true }\n//@VDM.viewType: #BASIC\n@AccessControl.authorizationCheck: #CHECK\n@ObjectModel.representativeKey: 'EmployeeUUID'\n@AbapCatalog.sqlViewName: 'SEPM_IEMPLOYEE'\ndefine view SEPM_I_Employee as\n  select from snwd_employees\n\nassociation [0..1] to SEPM_I_Company               as _Company               on $projection.CompanyUUID        = _Company.CompanyUUID  \n...\n\n{\n  key snwd_employees.node_key      as EmployeeUUID,\n  @ObjectModel.foreignKey.association: '_Company'  \n  snwd_employees.parent_key        as CompanyUUID,\n...}\nExample 2 \nExample for transactional data (fact). \nSample Code\n@EndUserText.label: 'EPM Demo: Sales Order Item with Addtl. Data (private view)'\n@Analytics.dataCategory: #CUBE\n@AccessControl.authorizationCheck: #CHECK\n@AbapCatalog.sqlViewName: 'SEPM_PSOIC'\n\ndefine view SEPM_P_SalesOrderItemCube\n  with parameters\n    P_DisplayCurrency : snwd_curr_code      //for currency conversion, TODO: data element with better description\n\n  as select from SEPM_I_SalesOrderItem\n\n  association [0..1] to SEPM_I_SalesOrder_E          as _SalesOrder_E      on  $projection.salesorder      = _SalesOrder_E.SalesOrder\n...\n  \n{\n                                                     @ObjectModel.foreignKey.association: '_SalesOrder_E'\n  key _SalesOrder.SalesOrder,\n                 _SalesOrder_E,\n...}\nExample 3 \nExample for defining a list of tables that should be logged for delta data extraction.\nSample Code\n@Analytics: {\n  dataCategory: #FACT,\n  dataExtraction: {\n    enabled: true,\n    delta.changeDataCapture.mapping: \n        [ { table: 'rsodpcdcunittab2', role: #MAIN, viewElement: ['view_key1', 'view_key2'], tableElement: ['tab_key1', 'tab_key2'] },\n          { table: 'rsodpcdcunittab1', role: #LEFT_OUTER_TO_ONE_JOIN, viewElement: ['view_key3'], tableElement: ['tab_key1'] } ] \n} }\nRelated Information\nObjectModel Annotations\nSemantics Annotations","nAnnotations":24,"fr":"Analytique : catégorie de données (dimension, fait, cube), requêtes analytiques, extraction et delta, paramètres d’exécution des requêtes.","kwFr":"analytique; cube; dimension; extraction; delta; requête","kwEn":"analytics; cube; dimension; extraction; delta; query"},{"domain":"AnalyticsDetails","description":"Enable application developers to specify the default multidimensional layout of the query, the sequence of variables in UI consumption, and the specific aggregation and planning behavior of the data. All these annotations can only be used in views with @Analytics.query : true.","definition":"@Scope:[#ELEMENT]\nAnnotation AnalyticsDetails\n {\n   query\n   {\n      formula : String;\n      axis : String enum { FREE; ROWS; COLUMNS; };\n      totals: String enum { HIDE; SHOW; };\n      scaling : Integer;\n      decimals : Integer;\n      displayHierarchy : String enum { OFF; ON; FILTER; };\n      hierarchyBinding : array of\n      {\n         type : String enum { ELEMENT; PARAMETER; CONSTANT; USER_INPUT; };\n         value : String;\n         variableSequence : Integer;\n      };\n      hierarchyInitialLevel : Integer;\n      hierarchySettings: {\n         hidePostedNodesValues: Boolean default true\n      };\n      elementHierarchy: {\n         parent: RefToElement;\n         initiallyCollapsed: Boolean default true\n      };\n   };\n   exceptionAggregationSteps : array of\n   {\n      exceptionAggregationBehavior : String enum { SUM; MIN; MAX; NHA; COUNT; COUNT_DISTINCT; AVG; STD; FIRST; LAST};\n      exceptionAggregationElements : array of elementRef;\n   };\n   planning\n   {\n      enabled : Boolean default true;\n      disaggregation : String enum { NONE; TOTAL; DIFFERENCE; };\n      distribution : String enum { EQUAL; PROPORTIONAL; PROPORTIONAL_REF; };\n      distributionReference : elementRef;\n   };\n   resultValueSource : String enum { CUBE; DIMENSION; };\n };\n@Scope:[#PARAMETER, #ELEMENT]\nAnnotation AnalyticsDetails\n {\n   query\n   {\n      display { KEY; TEXT; TEXT_KEY; KEY_TEXT; }\n      hidden\n      sortDirection\n      variableSequence : Integer;\n   };\n };","after":"Examples\nExample 1\nCalculated Elements\nSample Code\n@Analytics.query : true\ndefine view fincancial as select from sales\n\n{\n  @AnalyticsDetails.query.axis : #ROWS\n  product,   \n  @AnalyticsDetails.query.axis : #COLUMNS\n  @AnalyticsDetails.query.formula : 'revenue - cost'\n\n  1 as absolute_margin,\n\n  @AnalyticsDetails.query.formula : 'NDIV0($projection.absolute_margin / revenue ) * 100'\n\n  1 as relative_margin,\n \n  @AnalyticsDetails.query.formula : 'CASE WHEN $projection.relative_margin > 20 THEN revenue ELSE 0 END'\n  1 as revenue_for_margin_gt_20 \n\n} \n\t\t\t\t\t\nExample 2 \nDisplay hierarchy selection: Specify the hierarchy directly.\nSample Code\n@Analytics.query : true\n\ndefine view costcenter_reporting \n\n  with parameters\n\n    cost_center_hier_param : String  \n\nas select from costcenters\n\n{\n\n  ...\n\n  @AnalyticsDetails.query : {\n\n    displayHierarchy: #ON,\n\n \n\n    hierarchyInitialLevel: 3,  // three levels of the hierarchy will be opened at start\n\n    hierarchySettings{hidePostedNodesValues: true },  // don't show posted node values \n\n    hierarchyBinding : \n\n    [ { type : #CONSTANT, value : 'CONTR_AREA_10' },  \n\n      { type : #PARAMETER, value : 'cost_center_hier_param' }\n\n    ]\n\n  } \n\n  costcenter,  // hierarchy node filter\n\n  costs,\n\n  ...  \n\n}\nExample 3\nUse of $session variables, especially $session.system_date.\nThe system supports variables like $session.system_date for different use cases: \nin cube parameters\nSample Code\n@Analytics.query : true\n\ndefine view  …\nas select from zCostCenter_Flt( P_KeyDate: $session.system_date )\nin queries on time-dependent master data in where clauses \nSample Code\n} where \n  DateTo   >= $session.system_date and \n  DateFrom <= $session.system_date\nin paths to time-dependent attributes or texts\nSample Code\n_CostCenter[1: DateTo >= $session.system_date and DateFrom <= $session.system_date]._Text[1: Language = $parameters.P_Language].Text as CostCenterText, \n\nin restricted key figures \nSample Code\ncase when PostingDate = $session.system_date\nRelated Information\nAggregation Annotations","nAnnotations":24,"fr":"Détails analytiques : comportement des éléments dans une requête analytique (axes, affichage, hiérarchies, formules, agrégation d’exception, planification).","kwFr":"requête; axe; formule; hiérarchie; planification","kwEn":"query; axis; formula; hierarchy; planning"},{"domain":"Consumption","description":"Define a specific behavior that relates to the consumption of CDS content through domain-specific frameworks.","definition":"@Scope:[#ELEMENT, #PARAMETER]\nAnnotation Consumption\n {\n   labelElement : elementRef;\n   quickInfoElement : ElementRef;\n   hidden : Boolean default true;\n   derivation\n   {\n      lookupEntity : entityRef;\n      pfcgMapping : String(30); \n      resultElement : elementRef;\n      resultElementHigh : elementRef;\n      resultHierarchyNode\n      {\n          nodeTypeElement : ElementRef;\n          mapping : array of\n          {\n              hierarchyElement : ElementRef;\n              lookupElement    : ElementRef;\n          };\n      };\n      binding : array of\n      {\n         targetParameter : parameterRef;\n         targetElement : elementRef;\n         type : String(10) enum { ELEMENT; PARAMETER; CONSTANT; SYTEM_FIELD };\n         value : String(512);\n      };\n   };\n };\n@Scope:[#ENTITY, #PARAMETER, #ELEMENT]\nAnnotation Consumption\n {\n   semanticObject : String;\n };\n@Scope:[#ELEMENT] \nAnnotation.Consumption\n {\n   filter\n   {\n      mandatory : Boolean default true;\n      defaultValue : Expression;\n      defaultValueHigh : Expression;\n      defaultHierarchyNode: { nodeType : elementRef ;\n             \t\t\t\t node : array of { element : elementRef;\n                              \t\t\t\t  value : expression } };\n      hidden : Boolean default true;\n      selectionType      : String(20) enum {SINGLE; INTERVAL; RANGE; HIERARCHY_NODE }\n      multipleSelections : Boolean default true;\n      hierarchyBinding : array of\n      {\n         type : String(10) enum { ELEMENT; PARAMETER; CONSTANT; USER_INPUT; };\n         value : String(512);\n         variableSequence : Integer;\n      };\n      businessDate :\n      {\n        at : Boolean default true;\n      };\n   };\n   groupWithElement: elementRef;\n   ranking\n   {  \n      functionParameterBinding : array of\n      {\n         functionId  : String(120);\n         parameterId : String(120);\n      };\n }\n@Scope: [#PARAMETER,#ELEMENT]\nAnnotation.Consumption\n   defaultValue : String(1024);\n   valueHelp    : ElementRef;\n   valueHelpDefinition: array of \n   { \n      qualifier: String(120); \n      entity  \n      { \n          @Scope:[#VIEW, #ELEMENT, #PARAMETER]\n          name    : String(40);\n          element : String(40);\n      };\n      association        : AssociationRef;\n      distinctValues     : Boolean default true;\n      additionalBinding : array of \n      {\n          localParameter : ParameterRef;\n          localElement   : ElementRef;\n          parameter      : String(40);\n          element        : String(40);                                                                                   \n          usage          : String(30) enum \n          {\n              FILTER; \n              RESULT; \n              FILTER_AND_RESULT;\n          };                                                                                   \n      };\n      label : String(60);\n      presentationVariantQualifier : String(120);\n   };\n@Scope: [#VIEW]\nAnnotation.Consumption\n {\n   dbHints : array of String(1298);\n   dbHintsCalculatedBy : String(255);\n }","after":"Via these annotations, the specific behavior is defined which is related to the consumption of CDS content. This metadata makes no assumptions about the concrete consumption technology/infrastructure, but it is applicable across multiple consumption technologies (e.g. Analytics or OData).\n\nExamples\nExample 1 \nThe annotations Consumption.labelElement and Consumption.quickInfo are used to link the corresponding text and ID fields:\nSample Code\nDEFINE VIEW SalesOrder\nAS SELECT FROM sepm_cds_sales_order AS so\n{\n  key so.sales_order_id AS SalesOrderId,\n  \n  @Consumption.labelElement: 'CompanyName'\n  @Consumption.quickInfoElement: 'CompanyDescription'\n  so.buyer_guid AS BuyerGuid,\n\n  so.company_name AS CompanyName,\n  \n  so.description AS CompanyDescription\n}\nExample 2 \nThe annotation Consumption.groupWithElement is used to define that the element CompanyName depends semantically on the element BuyerGuid. In the case of an aggregated table, the fields can be displayed combined:\nSample Code\nDEFINE VIEW SalesOrder with parameters\nAS SELECT FROM sepm_cds_sales_order AS so\n{\n  key so.sales_order_key AS NodeKey,\n  \n  so.buyer_guid AS BuyerGuid,\n  \n  @Consumption.groupWithElement: 'BuyerGuid'\n  so.company_name AS CompanyName,\n  \n  so.currency_code AS CurrencyCode,\n\n  @DefaultAggregation: #SUM\n  so.gross_amount AS GrossAmount\n}\nExample 3 \nThe annotation Consumption.hidden is used to prevent fields from being exposed by OData. The annotation, therefore, prevents fields from being available to the client. This is necessary for system parameters because these parameters need to be filled by the runtime-engine, but must not be available to the client: \nSample Code\nDEFINE VIEW SalesOrder\nAS SELECT FROM sepm_cds_sales_order AS so\n  ASSOCIATION [0..1] TO sepm_cds_business_partner AS _Customer \n  on $projection.BuyerGuid = _Customer.business_partner_key\n{\n  \n  key so.sales_order_id AS SalesOrderId,\n \n  @Consumption.hidden: true\n  so.buyer_guid AS BuyerGuid,\n \n  _Customer.company_name AS CompanyName\n}\nExample 4 \nThe annotation Consumption.defaultValue is used to specify default values for parameters. In this example, the currency EUR is used:\nSample Code\nDEFINE VIEW SalesOrder with parameters\n    @Consumption.defaultValue: 'EUR' \n    p_TargetCurrency : snwd_curr_code\nAS SELECT FROM sepm_cds_sales_order AS so\n{\n  key so.sales_order_key AS NodeKey,\n  \n  $parameters.p_TargetCurrency AS CurrencyCode,\n\n  currency_conversion( \n    amount              => so.gross_amount, \n    source_currency     => so.currency_code, \n    target_currency     => $parameters.p_TargetCurrency,\n    exchange_rate_date  => CAST( '20150101' AS abap.dats )\n  ) AS GrossAmount\n}\nExample 5 \nThe annotation Consumption.valueHelp is used to expose an association as a value help. In this example, the CDS view CurrencyCodeValueHelp is used for the field CurrencyCode:\nThe annotation Consumption.valueHelpDefinition is used to define a value help for the annotated element. The value help provider can be a different CDS entity without association. To consume the value help, the value help provider entity must be added to the respective OData service. \nYou can filter the available value help options by defining an additional binding. In the following example case, only the business partners are displayed that use the same currency code. \nSample Code\nDEFINE VIEW BuPaView AS SELECT FROM db_bp\n{\n  key bp.bp_id                       as BusinessPartnerID,\n...\n      bp.currency_code               as CurrencyCode,\n      bp.company_name                as CompanyName,\n}\n\nDEFINE VIEW SOView AS SELECT FROM db_so as so\n{\n  so.sales_order_id as SalesOrderID,\n  …\n  so.CurrencyCode as CurrCode,\n  @Consumption.valueHelpDefinition: [{ entity : { name    : 'I_AIVS_BusinessPartner',                 \n                                                  element : 'BusinessPartnerID'},\n                                       additionalBinding  : [{ localElement   : 'CurrCode',\n                                                               element        : 'CurrencyCode'\n                                                            }]\n                                    }]\n  _BusinessPartner.BusinessPartnerID\nExample 6 \nThe association Consumption.semanticObject is used to assign semantic objects to CDS views or elements that can be used in the UI for intent-based navigation.\nSample Code\n@Consumption.semanticObject: 'SalesOrder'\nDEFINE VIEW SalesOrder    \nAS SELECT FROM sepm_cds_sales_order AS so\n{\n  so.sales_order_id AS SalesOrderId, \n\n  @Consumption.semanticObject: 'BusinessPartner'\n  so.buyer_guid AS BuyerGuid,\n}\nExample 7 \nThe annotation Consumption.filter is used to enable filters for values. In this example, product_hierarchy is filtered for several single values of calendar_day, and for one single interval of product.\nSample Code\n@Analytics.query : true\nDEFINE VIEW product_hierarchy\nAS SELECT FROM sales\n{  \n   ...\n   @Consumption.filter : { selectionType : #SINGLE, multipleSelections : true}    \n   calendar_day,    //several single values are allowed\n   @Consumption.filter : { selectionType : #INTERVAL, multipleSelections : false }  \n   product,      \t  // single interval allowed  \n   ...\n}\nExample 8 \nThe annotation Consumption.filter is used to enable filters for values. In this example, costcenter_reporting is filtered hierarchically for the constant CONTR_AREA_10 and for the parameter cost_center_hier_param.\nSample Code\n@Analytics.query : true\nDEFINE VIEW costcenter_reporting\n  with parameters cost_center_hier_param : String \nAS SELECT FROM costcenters\n{\n  ...\n  @Consumption.filter : {\n    selectionType : #HIERARCHY_NODE, \n    multipleSelections : false,\n    hierarchyBinding :\n    [ { type : #CONSTANT, value : 'CONTR_AREA_10' }, \n      { type : #PARAMETER, value : 'cost_center_hier_param' } ]\n  }\n  costcenter,     // hierarchy node filter\n \n  costs,\n  ...\n}\nExample 9 \nThis example shows how to specify hierarchy nodes as default value in the Consumption.filter annotation. A consumption view should provide a prompt for a hierarchy node of a costcenter hierarchy with default 1000/ALL (HierarchyNode).\nSample Code\n@Consumption.filter{ selectionType: #HIERARCHY_NODE ;\n                             defaultHierarchyNode: { nodeType : ‘HierarchyNode’ ;\n                                                     node: [ { element: ‘ControllingArea’ ; value: ‘1000’ };\n                                                             { element: ‘HierarchyNode’ ; value: ‘ALL’ } ] };\n                             hierarchyBinding: [ … ] };\ncostCenter;\nExample 10 \nThis example shows how to enable the Consumption.derivation annotation to return hierarchy nodes. The annotation Consumption.derivation.resultHierarchyNode is used to return hierarchy nodes. Given a view CostcenterResponsible with fields field1, field2, field3, field4, and responsible. The query view should filter by the costcenter nodes the given responsible (parameter) is responsible for.\nSample Code\n@Consumption.filter: { selectionType: #HIERARCHY_NODE ;\n                              hierarchyBinding: [ … ] };\n@Consumption.derivation.resultHierarchyNode:\n           { lookupEntity: ‘CostcenterResponsible’;\n             nodeTypeElement: ‘field1’;\n             mapping: [ { hierarchyElement : ‘ControllingArea’ ; lookupElement: ‘field2’ } ;\n                        { hierarchy Element: ‘CostCenter’ ; lookupElement: ‘field3’ };\n                        { hierarchyElement: ‘HierarchyNode’ ; lookupElement: ‘field4’ } ] };\n@Consumption.hidden: true;\ncostCenter;\nThe hierarchy binding is derived from Consumption.filter.hierarchyBinding. Consumption.derivation can only be used in combination with Consumption.filter. Furthermore Consumption.filter.selectionType: #HIERARCHY_NODE has to be true.\nExample 11 \nThis example shows how to define and use access policy with PFCG-mapping: \nSample Code\n// Access policy with PFCG-mapping\ndefine accesspolicy I_ProfitCenterHierAuth {\n \n  pfcg_mapping I_ProfitCenterHierAuth between I_ProfitCenterHierarchyNode and K_PCA_HIER using I_ProfitCenterHierSubTree\n  {\n      ProfitCenterHierarchy   = PCTRHIER,\n      ControllingArea         = KOKRS,\n      HierarchyNode           = PCTRHIERND\n  }\n}\n \n// Analytic Query\n@Analytics.query: true\ndefine view ...\n  with parameters\n    @Consumption.derivation: { pfcgMapping: 'I_PROFITCENTERHIERAUTH' ,\n                               resultElement: 'ProfitCenterHierarchy' }\n    P_ProfitCenterHierarchy : fis_hryid_prctr,\n \n    @Consumption.derivation: { pfcgMapping: 'I_PROFITCENTERHIERAUTH' ,\n                               resultElement: 'ControllingArea' }\n    P_ControllingArea : fis_kokrs,\n     \n  as select from ...\n{\n  ...\n  @AnalyticsDetails.query.axis: #ROWS\n  @Consumption.filter:\n  { selectionType : #HIERARCHY_NODE,\n    multipleSelections: true,\n    hierarchyBinding: [ { type: #PARAMETER, value: 'P_ControllingArea' }\n                        { type: #PARAMETER, value: 'P_ProfitCenterHierarchy' }]\n  }\n  @Consumption.derivation.pfcgMapping: 'I_PROFITCENTERHIERAUTH'\n  @AnalyticsDetails.query.displayHierarchy: #FILTER\n  ProfitCenter,\n  ... \n}","nAnnotations":37,"fr":"Consommation : filtres, paramètres, valeurs par défaut, dérivations, aides à la saisie, masquage pour les frameworks consommateurs (UI, analytique).","kwFr":"filtre; paramètre; variable; aide à la saisie; F4; défaut","kwEn":"filter; parameter; variable; value help; default"},{"domain":"Aggregation","description":"Specifies aggregation behavior at element level","definition":"@Scope:[#ELEMENT] \nannotation Aggregation\n{\n  default: String(30) enum\n\t{\n\t  NONE;\n\t  SUM;\n\t  MIN;\n\t  MAX;\n\t  AVG;\n\t  COUNT_DISTINCT;\n\t  NOP;\n\t  FORMULA;\n\t};\n  exception : String( 30) enum\n\t{ \n\t  SUM;\n\t  MIN;\n\t  MAX;\n\t  AVG;\n\t  COUNT;\n\t  COUNT_DISTINCT;\n\t  FIRST;\n\t  LAST;\n\t  STANDARD_DEVIATION;\n\t  VARIANCE;\n\t  MEDIAN;\n\t  NHA; \n\t};\n  referenceElement : array of ElementRef;\n}; ","after":"With this annotation, you can specify the aggregation behaviour of elements in generic usage like analytic manager or ODATA. Elements without default aggregation or with Aggregation.default: #NONE will not be aggregated and will be used in GROUP BY for aggregating access. Elements that can be aggregated are known as measures. \n\nExamples\nExample 1: default Aggregation \nSample Code\n@Semantics.currencyCode:true\nGlobalCurrency,\n\n@Aggregation.default: #SUM\n@Semantics: { amount : {currencyCode: 'GlobalCurrency'} } \nFixedAmountInGlobalCrcy,\nWhen selecting FixedAmountInGlobalCrcy the SUM of this element is calculated.\nExample 2: exception aggregation \nSample Code\ncalendarDay,\n@Semantics.unitOfMeasure: true \nunit,\n@Aggregation.default: #SUM\n@Aggregation.exception: #LAST\n@Aggrgation.referenceElement: ‘calenderDay’\n@Semantics.quantity : ‘unit'\nQuantity\nThis view describes the quantity of certain goods in a stock per calendar day. The measure quantity can be aggregated with SUM for all dimensions except the calendar day. \n\nExample 3: Counter-optimized\nFor CDS views representing master data reports (the FROM clause refers to a CDS view categorized as #DIMENSION), a counter of the different dimension values can be defined by combining the annotation Aggregation: #SUM with a select list entry containing constant value 1: \nSample Code\n@EndUserText.label: 'CostCenters per ControllingArea'\n@Analytics.query: true\ndefine view ControllingAreaView \nas SELECT from CostCenterDimension {\ncontrollingArea,\n@Aggregation: #SUM\n1 as costCenterCount\n}\n\t\nWith costCenter in the key of the dimension, no exception aggregation is involved, thus improving the performance of the report. \nNote\nThis pattern can be combined with CAST statements (for reusing texts of DDIC data types) and/or CASE statements (for defining restricted measures). You must not use other constants than 1 however, or add annotation AnalytcisDetails.query.formula.\nRelated Information\nAnalyticsDetails Annotations","nAnnotations":3,"fr":"Agrégation : agrégation standard et d’exception des mesures, élément de référence (comptage, moyenne…).","kwFr":"agrégation; somme; moyenne; mesure; indicateur","kwEn":"aggregation; sum; average; measure; key figure"},{"domain":"Hierarchy","description":"Enables an application developer to specify a parent-child hierarchy that s/he wants to make explicitly accessible in a data model, together with the structure that defines this hierarchy.","definition":"@Scope:[#VIEW]\nAnnotation Hierarchy\n {\n   parentChild : array of\n   {\n      name : String(127);\n      label : String;\n      multipleParents : Boolean default true;\n      recurseBy : elementRef;\n      recurse\n      {\n         parent : array of elementRef;\n         child : array of elementRef;\n      };\n      siblingsOrder : array of\n      {\n         by : elementRef;\n         direction : String(4) enum { ASC = 'ASC'; DESC = 'DESC'; } default #ASC;\n      };\n      rootNode\n      {\n         visibility : String(25) enum { ADD_ROOT_NODE_IF_DEFINED; ADD_ROOT_NODE; DO_NOT_ADD_ROOT_NODE; } default #ADD_ROOT_NODE_IF_DEFINED;\n      };\n      orphanedNode\n      {\n         handling : String(20) enum { ROOT_NODES; ERROR; IGNORE; STEPPARENT_NODE; } default #ROOT_NODES;\n         stepParentNodeId : array of String;\n      };\n      directory : associationRef;\n   };\n };","after":"The parent-child hierarchy is based directly on the master data entities. The hierarchy is time-dependent if the master data entity is as well. The hierarchy is defined either by one parent element (with Hierarchy.parentChild.recurseBy) or by multiple parents (with Hierarchy.parentChild.recurse). A parent element describes a self-referencing relationship within the master data entity and will usually be defined via an association. Only one level needs to be assigned to a parent-child hierarchy, because the levels in the hierarchy are taken from the parent-child relationships between members associated with the parent element. One or more parent-child hierarchies can be defined within the same master data entity. \nNote\nA simple example of a parent-child hierarchy is the “Employee” master data. A “Manager” is an “Employee” and almost every “Employee” is assigned to a “Manager”. \nOn entity level the following metadata can be defined: \n\nExamples\nExample 1 \nParent Child Hierarchy for Views with Associations:\nSample Code\n@Analytics : { dataCategory : #DIMENSION, replicationEnabled }\n@Hierarchy.parentChild : [ { name : ‘Organisation’, recurseBy : ‘Manager’} ]\nentity Employee {\nkey ID : String(8);\nManager : Association to this;\n...\n};\nExample 2 \nParent Child Hierarchy for Views without Associations:\nSample Code\n@Analytics : { dataCategory : #DIMENSION, replicationEnabled }\n@Hierarchy.parentChild : [ { name : ‘Organisation’, \n  recurse : {  parent : [ ‘Manager’ ] ,\n               child : [ ‘ID’] } \n  } ]\nentity Employee {\nkey ID : String(8);\nManager : String(8);\n...\n};\nExample 3 \nHierarchy Directory Association:\nSample Code\n@Analytics : { dataCategory : #HIERARCHY }\n@Hierarchy.parentChild : { \n    recurseBy : ‘ParentNode’,\n    directory: ‘CostCenterHierarchyDirectory’ \n  }\nentity CostCenterHierarchyNode {\n key CostCenterHierarchyDirectory : Association to CostCenterHierarchyDirectory;\n key HierarchyNode : CostCenterHierarchyNode;\n     ParentNode : Association to this;\n...\n};","nAnnotations":12,"fr":"Hiérarchies parent-enfant : définition récursive, nœuds orphelins, racines, ordre des frères, répertoire de hiérarchies.","kwFr":"hiérarchie; parent; enfant; nœud; arbre","kwEn":"hierarchy; parent child; node; tree"},{"domain":"ObjectModel","description":"Provide definitions of structural as well as transactional related aspects of the business data model","definition":"@Scope:[#VIEW]\nAnnotation ObjectModel\n {\n   lifecycle {\n\tprocessor: \n\t {\n\t\texpiryBehavior : String(30) enum { RELATIVE_TO_PROCESSING_START; RELATIVE_TO_LAST_CHANGE; } default #RELATIVE_TO_LAST_CHANGE;\n\t\texpiryInterval : String(20) default ‘PT15M’;\n\t\tnotificationBeforeExpiryInterval : String(20) default ‘PT5M’;\n\t };\n      enqueue\n      {\n         expiryBehavior : String enum { RELATIVE_TO_ENQUEUE_START; RELATIVE_TO_LAST_CHANGE; } default #RELATIVE_TO_LAST_CHANGE;\n         expiryInterval : String;\n         notificationBeforeExpiryInterval : String;\n      };\n      processing\n      {\n         expiryBehavior : String enum { RELATIVE_TO_PROCESSING_START; RELATIVE_TO_LAST_CHANGE; } default #RELATIVE_TO_LAST_CHANGE;\n         expiryInterval : String;\n         notificationBeforeExpiryInterval : String;\n      };\n\t  draft: \n\t  {\n\t\texpiryBehavior : String enum { RELATIVE_TO_PROCESSING_START; RELATIVE_TO_LAST_CHANGE; } default #RELATIVE_TO_LAST_CHANGE;\n\t\texpiryInterval : String default ‘P28D’;\n\t\tnotificationBeforeExpiryInterval : String(20) default ‘P10D’;\n\t};\n   modelCategory : String enum { BUSINESS_OBJECT; };\n   dataCategory : String enum { TEXT; HIERARCHY; };\n   representativeKey : keyElementRef;\n   semanticKey : array of elementRef;\n   compositionRoot : Boolean default true;\n   transactionalProcessingEnabled : Boolean default true;\n   transactionalProcessingDelegated : Boolean default true;\n   createEnabled : Boolean default true;\n   updateEnabled : Boolean default true;\n   deleteEnabled : Boolean default true;\n   writeDraftPersistence : String;\n   writeActivePersistence : String;\n   entityChangeStateId : elementRef;\n };\n@Scope:[#ELEMENT] \nAnnotation ObjectModel\n {\n   association\n   {\n      type : array of String enum { TO_COMPOSITION_CHILD; TO_COMPOSITION_PARENT; TO_COMPOSITION_ROOT; };\n   };\n   createEnabled : Boolean default true;\n   usageType { serviceQuality : String(30) enum {A; B; C; D; X;}\n                                           default ‘X’; \n              sizeCategory : String(3) enum {S; M; L; XL; XXL;}\n                                           default ‘S’; \n              dataClass : String(30) enum {TRANSACTIONAL; \n                                           MASTER;\n                                           ORGANIZATIONAL;\n                                           CUSTOMIZING;\n                                           META;\n                                           MIXED;} \n                                           default ‘MIXED’;\n             };\n   text\n   {\n      element : array of elementRef;\n      association : associationRef;\n   };\n   hierarchy\n   {\n      association : associationRef;\n   };      \n   foreignKey\n   {\n      association : associationRef;\n   };\n   readOnly : Boolean default true;\n   mandatory : Boolean default true;\n   enabled : Boolean default true;\n };","after":"Examples\nExample 1 \nThis example demonstrates how you can define a compositional hierarchy. \nSample Code\n@ObjectModel.modelCategory: #BUSINESS_OBJECT\n@ObjectModel.compositionRoot: true\ndefine view I_SalesOrder \n  \tassociation [0..*] to I_SalesOrderItem as _Item ... {\n\t\t@ObjectModel.association.type: #TO_COMPOSITION_CHILD\n\t\t_Item, ...\n}\n\ndefine view I_SalesOrderItem\n \tassociation [1..1] to I_SalesOrder as _SalesOrder ... { \n\t\t@ObjectModel.association.type: [#TO_COMPOSITION_ROOT, \n                                #TO_COMPOSITION_PARENT]\n\t\t_SalesOrder, ...\n}  \t\t\t\n\t\t    \t\t\t\nExample 2 \nThis example demonstrates how you can define foreign key relationship.\nSample Code\ndefine view I_SalesOrderItem \n  association [0..1] to I_Material as _Material \n    on $projection.Material = _Material.Material ... { \n      @ObjectModel.foreignKey.association: ’_Material’\n      Material,\n      _Material, ...\n}\n\n@ObjectModel.representativeKey: ’Material’\ndefine view I_Material ... { \n     key Material, ...\n}\n\t\nExample 3 \nThis example demonstrates how you can define language-dependent texts \nSample Code\ndefine view I_Material \n  association [0..*] to I_MaterialText as _Text ... { \n      @ObjectModel.text.association: ’_Text’\n      key Material, \n      _Text, ...\n}\n\n@ObjectModel.dataCategory: #TEXT\n@ObjectModel.representativeKey: ’Material’\ndefine view I_MaterialText ... { \n      key Material, \n      @Semantics.language: true\n      key Language,\n      @Semantics.text: true\n      MaterialName,\n      @Semantics.text: true\n      MaterialDescription, ...\n}\n\t\nExample 4 \nThis example demonstrates how you can define language-independent texts \nSample Code\ndefine view I_Plant ... { \n      @ObjectModel.text.element: [’PlantName’]\n      key Plant, \n      @Semantics.text: true\n      PlantName, ...\n}\n\t\nExample 5 \nThis example demonstrates how you can define the transactional behavior \nSample Code\n@ObjectModel.compositionRoot: true\n@ObjectModel.transactionalProcessingEnabled: true\n@ObjectModel.writeDraftPersistence: ‘<DraftDDICTable>’\ndefine view I_MaterialWithDraft ... { \n   ...\n}","nAnnotations":36,"fr":"Modèle objet : clés représentatives, associations de clé étrangère et de texte, catégorie de données, volumétrie, objets métier transactionnels et draft (BOPF).","kwFr":"modèle objet; clé; texte; association; draft; BOPF","kwEn":"object model; key; text; association; draft; BOPF"},{"domain":"OData","description":"Capture OData-related aspects to expose data gained from a CDS entity in an OData service.","definition":"@Scope:[#VIEW, #TABLE_FUNCTION]\nAnnotation OData\n {\n   publish : Boolean default true;\n };","after":"Note\nWhen the CDS entity is activated, the OData service is generated automatically. Before you can open and use the OData service, it also needs to be activated using transaction /IWFND/MAINT_SERVICE manually. For further information, see the Related Information below.\nYou can then start the generated OData service through your Eclipse-based IDE. To do this, choose F2 from the name of the CDS entity that is used in the define view statement. The ABAP Element Information popup is then opened. In the Generated Objects section, the OData Service link is provided. After clicking the link, the default Internet browser is opened and displays its XML code.\nExamples\nThis example demonstrates how you can define the SEPM_I_SalesOrder CDS entity that exposes data to an OData service.\nHere, an OData service is generated for the CDS entity. The data is provided from the database table snwd_so.\nSample Code\n@OData.publish:true\ndefine view SEPM_I_SalesOrder as select from snwd_so {\n\t...\n}\nRelated Information\nGenerating OData Service With Auto-Exposure","nAnnotations":1,"fr":"OData : publication automatique d’un service OData depuis la vue.","kwFr":"OData; service; publication; Fiori","kwEn":"OData; service; publish; Fiori"},{"domain":"Semantics","description":"Used by the core engines for data processing, analytics, and data consumption","definition":"@Scope:[#ELEMENT, #PARAMETER]\nAnnotation Semantics\n {\n   telephone\n   {\n      type : array of String(10) enum { HOME; CELL; WORK; FAX; PREF; TEXT; VOICE; VIDEO; PAGER; TEXT_PHONE; } default #PREF;\n   };\n   eMail\n   {\n      type : array of String(10) enum { HOME; WORK; PREF; OTHER; } default #PREF;\n      address : Boolean default true;\n      from : Boolean default true;\n      sender : Boolean default true;\n      to : Boolean default true;\n      cc : Boolean default true;\n      bcc : Boolean default true;\n      subject : Boolean default true;\n      body : Boolean default true;\n      keywords : Boolean default true;\n      received : Boolean default true;\n   };\n   name\n   {\n      fullName : Boolean default true;\n      givenName : Boolean default true;\n      additionalName : Boolean default true;\n      familyName : Boolean default true;\n      nickName : Boolean default true;\n      suffix : Boolean default true;\n      prefix : Boolean default true;\n      jobTitle : Boolean default true;\n   };\n   address\n   {\n      type : array of String(10) enum { HOME; WORK; PREF; OTHER; } default #PREF;\n      city : Boolean default true;\n      street : Boolean default true;\n\t streetNoNumber : Boolean default true;\n      number : Boolean default true;\n      country : Boolean default true;\n      region : Boolean default true;\n      subRegion : Boolean default true;\n      zipCode : Boolean default true;\n      postBox : Boolean default true;\n      label : Boolean default true;\n   };\n   organization\n   {\n      name : Boolean default true;\n      unit : Boolean default true;\n      role : Boolean default true;\n   };\n   calendarItem\n   {\n      summary : Boolean default true;\n      description : Boolean default true;\n      categories : Boolean default true;\n      dtStart : Boolean default true;\n      dtEnd : Boolean default true;\n      duration : Boolean default true;\n      due : Boolean default true;\n      completed : Boolean default true;\n      priority : Boolean default true;\n      class : Boolean default true;\n      status : Boolean default true;\n      percentComplete : Boolean default true;\n      contact : Boolean default true;\n      location : Boolean default true;\n      transparent : Boolean default true;\n      fbType : Boolean default true;\n      wholeDay : Boolean default true;\n   };\n   businessDate\n   {\n      at : Boolean default true;\n      from : Boolean default true;\n      to : Boolean default true;\n      createdAt : Boolean default true;\n      lastChangedAt : Boolean default true;\n   };\n   systemDate\n   {\n      createdAt : Boolean default true;\n      lastChangedAt : Boolean default true;\n   };\n   time : Boolean default true;\n   durationInSeconds : Boolean default true;\n   calendar\n   {\n      dayOfMonth : Boolean default true;\n      dayOfYear : Boolean default true;\n      week : Boolean default true;\n      month : Boolean default true;\n      quarter : Boolean default true;\n\t halfyear : Boolean default true;\n      year : Boolean default true;\n      yearWeek : Boolean default true;\n      yearMonth : Boolean default true;\n      yearQuarter : Boolean default true;\n\t yearHalfyear : Boolean default true;\n   };\n   fiscal\n   {\n      yearVariant : Boolean default true;\n      period : Boolean default true;\n      year : Boolean default true;\n      yearPeriod : Boolean default true;\n   };\n   geoLocation\n   {\n      longitude : Boolean default true;\n      latitude : Boolean default true;\n      cartoId : Boolean default true;\n      normalizedName : Boolean default true;\n   };\n   url\n   {\n      mimeType : elementRef;\n   };\n   imageUrl : Boolean default true;\n   contact\n   {\n      type : String(10) enum {PERSON; ORGANIZATION; };\n      note : Boolean default true;\n      photo : Boolean default true;\n      birthDate : Boolean default true;\n   };\n   user\n   {\n      id : Boolean default true;\n      createdBy : Boolean default true;\n      lastChangedBy : Boolean default true;\n      responsible : Boolean default true;\n   };\n   mimeType : Boolean default true;\n   text : Boolean default true;\n   language : Boolean default true;\n   languageReference : elementRef;\n }; \n@Scope:[#ELEMENT] \nAnnotation Semantics\n {\n   amount\n   {\n      currencyCode : elementRef;\n   };\n   quantity\n   {\n      unitOfMeasure : elementRef;\n   };\n   currencyCode : Boolean default true;\n   unitOfMeasure : Boolean default true;\n };","after":"Semantic annotations are used to inform the client as to which of the elements contain a phone number, a part of a name or address, or something relating to a calendar event. They must not be bound, for example, to a dedicated consumption channel. They need to be available for consumption through OData, (S)QL, and so on.\nSemantic annotations complement the concept of semantic data types, while semantic data types always introduce specific behavior in the provider/core infrastructure (through dedicated operations or conversion functions). \nSemantic annotations allow the standardizing of semantics that only have an impact on the consumption side (such as telephone number, mail address, city, and so on).\n\nExamples\nExample 1\nThe following CDS view fetches the contact data. Here, the annotations assign to the corresponding fields the relevant semantic information, such as first name, last name, and so on.\nSample Code\nDEFINE VIEW ContactPerson ...\nASSOCIATION [1..1] TO FormattedName AS _FormattedName ON ...\n{\n  ...\n  @Semantics.name.givenName\n  FirstName, \n\n  @Semantics.name.additionalName\n  MiddleName, \n\n  @Semantics.name.familyName\n  LastName, \n\n  @Semantics.user.id\n  SystemUser, \n\n  Initials, \n\n  GenderCode, \n\n  AddressUUID, \n\n  @Semantics.telephone.type: [#WORK, #PREF] \n  PhoneNumber, \n\n  @Semantics.telephone.type: [#FAX] \n  FaxNumber, \n\n  @Semantics.telephone.type: [#CELL] \n  MobilePhoneNumber,\n\n  @Semantics.eMail.address \n  EmailAddress, \n\n  PreferredLanguage,\n\n  @Semantics.contact.birthDate \n  BirthDate,\n\n  @Semantics.name.fullName\n  _FormattedName.FormattedContactName,\n  ...\n}\nExample 2\nThe following CDS view fetches sales order items. Here, the annotations assign the units and currencies to the corresponding fields.\nSample Code\nDEFINE VIEW SalesOrderItem as select from ... \n{\n    ...\n    \n    @Semantics.currencyCode\n    currency_code as CurrencyCode,\n    \n    @Semantics.amount.currencyCode: 'CurrencyCode' \n    gross_amount as GrossAmount,\n    \n    @Semantics.unitOfMeasure\n    unit_of_measure as UnitOfMeasure,\n    \n    @Semantics.quantity.unitOfMeasure: 'UnitOfMeasure' \n    quantity as Quantity,\n    \n    ...   \n}\nExample 3\nThe following CDS view fetches geographic data of cities annotating the corresponding location fields according to a standardized format:\nSample Code\nDEFINE VIEW myGeoAttributeView as select from ... \n{ \n  @Semantics.address.city\n  cartoid,\n\n  @Semantics.geoLocation.longitude\n  Longitude,\n\n  @Semantics.geoLocation.latitude\n  latitude,\n\n  @Semantics.geoLocation.normalizedName\n  name\n}\nExample 4\nThe following CDS view fetches language-dependant data annotating the corresponding language fields and text fields:\nSample Code\nDEFINE VIEW chartOfAccountsTexts AS SELECT FROM ...\n{\n  key ktopl AS chartOfAccounts,\n\n  @Semantics.language: true\n  key spras AS language,\n\n  @Semantics.text: true   \n  ktplt AS chartOfAccountsName\n}","nAnnotations":97,"fr":"Sémantique : signification métier des champs (montant/devise, quantité/unité, dates, calendrier, exercice, adresse, contact, e-mail, utilisateur…).","kwFr":"sémantique; devise; unité; date; adresse; contact","kwEn":"semantics; currency; unit; date; address; contact"},{"domain":"VDM","description":"Allow classifying views of the virtual data model in terms of their admissible reuse options and provisioned content","definition":"@CompatibilityContract:{ c1.usageAllowed: false,\n                         c2.usageAllowed: false }\nannotation VDM\n  {\n  @Scope:[#VIEW]\n  @CompatibilityContract:{ c1: { usageAllowed: false },\n                           c2: { usageAllowed: false }\n                         }\n  auxiliaryEntity: { for: { entity: EntityRef; };\n                     usage: { type: array of String(30) enum {ENTERPRISE_SEARCH;}; };\n                   };\n  @CompatibilityContract:{ c1: { usageAllowed: true,\n                                   allowedChanges: { annotation: [#ANY],\n                                                     value: [#ANY] }\n                               },\n                             c2: { usageAllowed: true,\n                                   allowedChanges: { annotation: [#ANY],\n                                                      value: [#ANY] }\n                                 }\n                           }\n  @Scope:[#ENTITY] \n  viewType : String(30) enum { BASIC; COMPOSITE; CONSUMPTION; EXTENSION; DERIVATION_FUNCTION; TRANSACTIONAL; }; \n  @Scope:[#VIEW, #TABLE_FUNCTION] \n  private : Boolean default true;\n  @Scope:[#EXTEND_VIEW] \n  viewExtension : Boolean default true;\n  @CompatibilityContract:{ c1: { usageAllowed: true,\n                                   allowedChanges: { annotation: [#ANY],\n                                                     value: [#ANY] }\n                                 },\n                             c2: { usageAllowed: false,\n                                   allowedChanges: { annotation: [#ANY],\n                                                     value: [#ANY] }\n                                 }\n                          }\n  lifecycle : {\n                @CompatibilityContract:{ c2: { usageAllowed: true,\n                                               allowedChanges: { annotation: [#ANY],\n                                                                 value: [#ANY] }\n                                             }\n                                       }\n                @Scope:[#ENTITY]\n                contract : { type : String(30) enum { PUBLIC_REMOTE_API;\n                                                      PUBLIC_LOCAL_API;\n                                                      SAP_INTERNAL_API;\n                                                      NONE; };\n                            };                    \n                 @Scope:[#ENTITY, #ELEMENT] \n                 status : String(30) enum { DEPRECATED; };\n                 @Scope:[#ENTITY, #ELEMENT] \n                 successor : String(30);\n                };\n @CompatibilityContract:{ c1: { usageAllowed: false\n                              },\n                          c2: { usageAllowed: true,\n                                allowedChanges: { annotation: [#ANY],\n                                                     value: [#ANY] }\n                              }\n                         }\n  @Scope:[#ENTITY]\n  usage : {\n              type: array of String(40) enum { ACTION_PARAMETER_STRUCTURE;\n                                               ACTION_RESULT_STRUCTURE;\n                                               EVENT_SIGNATURE;\n                                               TRANSACTIONAL_PROCESSING_SERVICE;};\n          };             \n};","after":"VDM is intended to be interpreted by view browsers and other functionality which is based on the virtual data model.\nThis classification is used only for SAP internal structuring and interpretation of the CDS entities. Releasing CDS entities for customers and partners is controlled by additional internal classification of the entities.\n\nExamples\nExample 1 \nDefining a basic VDM view:\nSample Code\n@VDM.viewType: #BASIC\ndefine view I_MyBasicView ...\nExample 2 \nDefining a private composite VDM view:\nSample Code\n@VDM.private: true\n@VDM.viewType: #COMPOSITE\ndefine view P_MyPrivateCompositeView ...\nExample 3 \nDefining Indian-specific VDM view extension:\nSample Code\n@VDM.viewExtension: true\nextend view I_MyExtendedView with X_IN_I_MyExtendedView ...\nExample 4 \nLifecycle annotations:\nSample Code\n@VDM.lifecycle.contract.type:#PUBLIC_LOCAL_API\ndefine view I_MyPublicLocalAPIView ...\n \n@VDM.lifecycle.contract.type:#PUBLIC_REMOTE_API\ndefine view A_MyPublicRemoteAPIView ...\n \n@VDM.lifecycle.status: #DEPRECATED\n@VDM.lifecycle.successor: 'I_MySuccessorView'\ndefine view I_MyDeprecatedView ...\nExample 5 \nAuxiliary entity annotations:\nSample Code\n@VDM.auxiliaryEntity:{ for.entity: 'I_BasicView',\n                       usage.type: [#ENTERPRISE_SEARCH] }\ndefine view N_BasicView \n  as select from DatabaseTable1 \n  left outer to one join DatabaseTable2\n    on DatabaseTable2.Field2 eq DatabaseTable1.Field2\n{\n  key DatabaseTable1.Field1,\n      cast( DatabaseTable2.Field3 as DataElement preserving type) as Field3 \n} \nwhere DatabaseTable1.Field4 eq 'VALUE4'\n  and DatabaseTable1.Field5 eq 'VALUE5'\nExample 6 \nVDM usage type:\nSample Code\n@VDM.usage.type:[#ACTION_PARAMETER_STRUCTURE]\n\ndefine abstract entity D_SampleEntityActionParameter ...\n\n@VDM.usage.type: [#EVENT_SIGNATURE]\n\n@VDM.usage.type:[#TRANSACTIONAL_PROCESSING_SERVICE]\n\n@VDM.viewType:#CONSUMPTION\n\n@ObjectModel.transactionalProcessingDelegated:true\n\ndefine view C_SampleTransactionalProcessingDelegatingView ...\n\n@Event: {sapObjectType: 'SAPObject',...}\n\ndefine abstract entity MyEventSignature ...","nAnnotations":10,"fr":"Virtual Data Model : type de vue (basic, composite, consumption…), vues privées, cycle de vie et contrat d’API.","kwFr":"VDM; type de vue; basic; composite; consumption; API","kwEn":"VDM; view type; basic; composite; consumption; API"},{"domain":"EnterpriseSearch","description":"Note","definition":"@Scope:[#VIEW, #TABLE_FUNCTION, #ENTITY] \nAnnotation EnterpriseSearch\n {\n   enabled : Boolean default true;\n };\n@Scope:[#ELEMENT] \nAnnotation EnterpriseSearch\n {\n   expand : Boolean default true;\n   filteringFacet : { default };\n   defaultValueSuggestElement : true;\n   usageMode : array of String(20) enum\n   {\n      ADVANCED_SEARCH = 'AdvancedSearch';\n      AUTO_FACET = 'AutoFacet';\n      SUGGESTION = 'Suggestion';\n   };\n   presentationMode : array of String(20) enum\n   {\n      DETAIL = 'Detail';\n      HIDDEN = 'Hidden';\n      IMAGE = 'Image';\n      SUMMARY = 'Summary';\n      THUMBNAIL = 'Thumbnail';\n      TITLE = 'Title';\n      NONE = 'None';\n   };\n   commonAttributes : array of String(100);\n   snippets\n   {\n      enabled : Boolean default true;\n      beginTag : String(128) default '<b>';\n      endTag : String(128) default '<b>';\n   };\n   highlighted\n   {\n      enabled : Boolean default true;\n      beginTag : String(128) default '<b>';\n      endTag : String(128) default '<b>';\n   };\n };","after":"Related Information\nSearch Annotations","nAnnotations":3,"fr":"Enterprise Search : activation de la recherche HANA Enterprise Search, facettes, suggestions.","kwFr":"recherche; facette; suggestion","kwEn":"enterprise search; facet; suggestion"},{"domain":"Search","description":"This annotation marks a view as searchable. You define the fuzziness threshold as well as the specifics of term mappings at element level.","definition":"@Scope:[#VIEW, #TABLE_FUNCTION] \nAnnotation Search\n {\n   searchable : Boolean default true;\n }; \n@Scope:[#ELEMENT] \nAnnotation Search\n {\n   defaultSearchElement : Boolean default true;\n   ranking : String(6) enum { HIGH = 'high'; MEDIUM = 'medium'; LOW = 'low'; } default #MEDIUM;\n   fuzzinessThreshold : Decimal(3,2);\n   termMappingDictionary : String(128);\n   termMappingListID : String(32);\n };","after":"","nAnnotations":6,"fr":"Recherche : vue recherchable, éléments de recherche libre, classement, recherche floue, synonymes.","kwFr":"recherche; plein texte; floue; synonyme","kwEn":"search; freestyle; fuzzy; synonym"}],"annotations":[{"domain":"AccessControl","name":"AccessControl.authorizationCheck","values":[{"value":"#NOT_REQUIRED","desc":"An authorization check is executed if a DCL role exists for the entity. If no role exists, there’s no check and no protection. This behavior is the same behavior at runtime as for value #CHECK. However, in this case it’s intended by the developer that no role exists.\nDuring development, no warning occurs when activating the entity.\nThis value is applied by default when no other annotation is specified."},{"value":"#NOT_ALLOWED","desc":"During the execution of a SELECT on a CDS entity, the access control protection is disabled.\nDuring development, a warning occurs if a developer activates a role for an entity, which has this annotation value."},{"value":"#CHECK","desc":"An authorization check is executed if a DCL role exists for the entity. If no role exists, there’s no check and no protection.\nDuring development, a warning occurs if a developer activates the entity and no DCL role exists for the entity."},{"value":"#MANDATORY","desc":"An access control must exist during the authorization runtime. The value is used for entities where access control is critical. Accidental removal of the access control must not remain unnoticed.\nDuring development, a runtime error occurs in ABAP SQL if an entity is accessed without access control."}],"meaning":"This element defines the behavior of the authorization check.","engine":"The runtime and design-time engines handle the authorization check based on the value of the element.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"AccessControl_authorizationCheck","fr":"Définit si et comment le contrôle d’autorisation DCL s’applique à la vue (non requis, obligatoire, désactivé…).","kwFr":["autorisation","contrôle d’accès","DCL","rôle","sécurité","habilitation"],"kwEn":["authorization check","access control","DCL role","security"],"usages":["auth"]},{"domain":"AccessControl","name":"AccessControl.privilegedAssociations","values":[{"value":"associationRef","desc":"All associations that are exposed in the projection list and that are mentioned in the list defined in this annotation should allow privileged access to the association target. No DCL check happens at runtime"}],"meaning":"This element defines","engine":"The runtime and design-time engines handle the authorization check based on the value of the element.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["TABLE_FUNCTION","VIEW"],"id":"AccessControl_privilegedAssociations","fr":"Liste les associations dont la cible est lue sans contrôle DCL (accès privilégié).","kwFr":["association privilégiée","sans contrôle","contournement DCL"],"kwEn":["privileged association","bypass DCL"],"usages":["auth","keys"]},{"domain":"AccessControl","name":"AccessControl.personalData.blocking","values":[{"value":"REQUIRED","desc":"Target CDS views, which use the annotation value REQUIRED, are use cases, where person-related data, including the related business partner master data, is valid for the primary business purpose as defined and used by the responsible data controller and should be processed. Blocked personal data can be included into the selection result, if the blocking status of the related business partner master data is set and when the user specifically has display authorization for blocked personal data."},{"value":"NOT_REQUIRED","desc":"Target CDS views, which use the annotation value NOT_REQUIRED, are use cases, where no person-related data is accessed. Therefore, the users of the CDS views don’t need to have an additional authorization condition for how to execute the data retrieval regarding the protection of personal data."},{"value":"BLOCKED_DATA_EXCLUDED","desc":"The annotation value BLOCKED_DATA_EXCLUDED reassures the consumer that blocked personal data is never exposed and thus no authorization checks for blocked personal data are required. The reason for not exposing blocked personal data is purely related to the underlying business logic. For instance, a modeled filter condition for the specific business purpose of the view, such as active data, guarantees in combination with the EoP (End of Purpose) check of the application that blocked personal data can never be retrieved with the view. The modeled filter condition shouldn’t be based on a specific personal data blocking status of the data or a specific authorization condition. For these cases, we recommend that the CDS entity use the annotations REQUIRED or #('TRANSACTIONAL_DATA')."},{"value":"BLOCKED_DATA_INCLUDED","desc":"Target CDS views, which use the annotation value BLOCKED_DATA_INCLUDED are exceptional use cases, where reporting for public authorities, for example, for auditing purposes, should be provided. This use case is a valid reason to process personal data beyond the end of the primary business purpose as defined and used by the responsible data controller. Companies are obliged to include all required data into these reports, which makes a differentiation between blocked and unblocked personal data obsolete. The users of the CDS views need a specific authorization for the application data or CDS view to execute the data retrieval for this specific use case, for example, based on a corresponding legal entity. It would contradict the protection of personal data, if these users would also always need a display authorization for blocked personal data, which they could use to see blocked personal data in other use cases."}],"meaning":"This element defines","engine":"The design-time engines handle the authorization check based on the value of the element.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["TABLE_FUNCTION","VIEW"],"id":"AccessControl_personalData_blocking","fr":"Indique comment la vue traite les données personnelles bloquées (fin de finalité, RGPD).","kwFr":["données personnelles","blocage","RGPD","fin de finalité","partenaire"],"kwEn":["personal data","blocking","GDPR","data privacy","end of purpose"],"usages":["privacy","auth"]},{"domain":"AccessControl","name":"AccessControl.readAccess.logging.logdomain","values":[{"value":"area as String","desc":"Name of the business area of the log domain\nFor a log domain, you specify a business area that the data element is related to. The business area is necessary because different applications might use the same log domain. For example, a log domain \"account\" might be something different in the Human Resources application than it is in the Banking application."},{"value":"domain as String","desc":"Name of the log domain\nThe log domain is a semantic description of semantically identical or related fields that have different technical representations."}],"meaning":"This element defines","engine":"The channel that implements the specific area sends the log-relevant field values to the read access logging framework.","type":"Array of area and domain as String","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW","ELEMENT","PARAMETER"],"id":"AccessControl_readAccess_logging_logdomain","fr":"Domaine de journalisation des accès en lecture (Read Access Logging) pour les champs sensibles.","kwFr":["journalisation","log de lecture","RAL","traçabilité","données sensibles"],"kwEn":["read access logging","RAL","log domain","sensitive data"],"usages":["privacy","auth"]},{"domain":"AccessControl","name":"AccessControl.readAccess.logging.output","values":[{"value":"true","desc":"The defined log domains are logged."},{"value":"false","desc":"The defined log domains are excluded from logging.\nThis value is the default value."}],"meaning":"This element defines","engine":"The value enables the logging of the log domain.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"AccessControl_readAccess_logging_output","fr":"Active la sortie de journalisation des accès en lecture pour la vue.","kwFr":["journalisation","log de lecture","RAL","traçabilité"],"kwEn":["read access logging","output","RAL"],"usages":["privacy","auth"]},{"domain":"Analytics","name":"Analytics.dataCategory","values":[{"value":"#DIMENSION","desc":"This value indicates that the entity represents master data. This kind of view can be used for replication and for queries. \nExample\nTypical dimensions are material view and customer view."},{"value":"#FACT","desc":"This value indicates that the entity represents transactional data (center of star schema). Usually it contains the measures. Typically, these views are necessary for replication. They therefore should not be joined with master data views."},{"value":"#CUBE","desc":"The #CUBE value (like #FACT) also represents factual data, but #CUBE does not have to be without redundancy. This means joins with master data are possible. Queries are usually built on top of #CUBE, where data is replicated from facts."},{"value":"#AGGREGATIONLEVEL","desc":"This value indicates a projection. For this kind of view, the analytic manager offers write-back functionality (planning functionality). Views in this category have to select from a view with dataCategory = #CUBE, which supports the annotation Analytics.writeBack.className. No associations are allowed, and elements cannot be renamed."}],"meaning":"Analytic queries can be defined on top of CDS views using the Analytics.dataCategory annotation.","engine":"By specifying the data category, the developer can provide directives and hints, telling the analytic manager how to interpret individual entities for example.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataCategory","fr":"Catégorie analytique de la vue : dimension, fait, cube ou niveau d’agrégation.","kwFr":["catégorie analytique","dimension","fait","cube","niveau d’agrégation","données de base","mouvements"],"kwEn":["data category","dimension","fact","cube","aggregation level","master data"],"usages":["model"]},{"domain":"Analytics","name":"Analytics.dataExtraction.enabled","values":[{"value":"true","desc":"The view is suitable for data replication. The default is true if this annotation is used."},{"value":"false","desc":"The view is not suitable for data replication."}],"meaning":"Application developers can use this annotation to mark views that are suitable for data replication (for example, delta capabilities must be provided for mass data).","engine":"Note This view must be annotated with Analytics.dataCategory (except the value AGGREGATIONLEVEL) or with ObjectModel.dataCategory with the value #TEXT or #HIERARACHY .","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_enabled","fr":"Déclare la vue apte à l’extraction / réplication de données (ODP, BW, Datasphere).","kwFr":["extraction","réplication","ODP","BW","Datasphere","source de données"],"kwEn":["data extraction","replication","ODP","datasource"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.byElement.name","values":[{"value":"elementName as String","desc":"Name of an element that should be used for filtering during generic delta extraction."}],"meaning":"Application developers can enable the generic delta extraction with this annotation. This is the element that should be used for filtering during generic delta extraction. This element can be either a date (ABAP type DATS) or a UTC time stamp.","engine":"Note If the field is a time stamp, the system also checks the annotation Semantics.systemDate.lastChangedAt: true. .","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_byElement_name","fr":"Delta générique : élément date ou horodatage utilisé pour filtrer les enregistrements modifiés.","kwFr":["delta","delta générique","horodatage","timestamp","date de modification"],"kwEn":["generic delta","timestamp","delta field"],"usages":["extract","time"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.byElement.maxDelayInSeconds","values":[{"value":"Integer","desc":"Maximum number of seconds between taking the time stamp and the successful database commit. The default is 1800 seconds."}],"meaning":"There is always a time delay between taking a UTC time stamp and the database commit. This annotation specifies the maximum possible delay in seconds.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Analytics_dataExtraction_delta_byElement_maxDelayInSeconds","fr":"Delta générique : délai maximal (secondes) entre horodatage et commit, pour ne rien perdre.","kwFr":["delta","marge de sécurité","délai","latence"],"kwEn":["delta","safety interval","delay"],"usages":["extract"]},{"domain":"Analytics","name":"Analytics.dataExtraction.delta.byElement.detectDeletedRecords","values":[{"value":"Boolean","desc":"The default is true if this annotation is used."}],"meaning":"By using this annotation, the system will remember all key combinations of the view that were extracted in delta mode. If a key combination does not occur in the view anymore, this will automatically generate a delete image in the
