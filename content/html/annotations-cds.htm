es suggestions (saisie semi-automatique).","kwFr":["suggestion","saisie semi-automatique","type-ahead"],"kwEn":["suggestion","type-ahead","autocomplete"],"usages":["search"]},{"domain":"Search","name":"Search.searchable","values":[{"value":"Boolean (true, false)","desc":"Defines whether a view is relevant for search or not.\nDefault: true"}],"meaning":"Defines if a CDS view or entity is generally relevant for search scenarios. This annotation must be set in case other search-related annotations are being defined for elements of the respective CDS view or entity. The annotation offers a general switch and a means to quickly detect whether a view is relevant or not.","engine":"Interpreted by Enterprise Search and SADL","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["VIEW"],"id":"Search_searchable","fr":"Rend la vue recherchable (prérequis des autres annotations de recherche).","kwFr":["recherche","recherchable","plein texte"],"kwEn":["searchable"],"usages":["search"]},{"domain":"Search","name":"Search.defaultSearchElement","values":[{"value":"Boolean (true, false)","desc":"Defines weather the element is to be considered in a freestyle search.\nDefault: true"}],"meaning":"Specifies that the element is to be considered in a freestyle search (for example a SELECT…) where no columns are specified. \nUsually, such a search must not operate on all elements – for performance reasons, and because not all elements (e.g. internal keys) do qualify for this kind of access.","engine":"Interpreted by Enterprise Search and SADL","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Search_defaultSearchElement","fr":"Élément inclus dans la recherche libre.","kwFr":["recherche libre","plein texte","élément"],"kwEn":["freestyle search","default search element"],"usages":["search"]},{"domain":"Search","name":"Search.ranking","values":[{"value":"HIGH","desc":"The element is of high relevancy; this holds usually for ID and their descriptions."},{"value":"MEDIUM","desc":"The element is of medium relevancy; this holds usually for other, important element. This is the default."},{"value":"LOW","desc":"Although the element is relevant for freestyle search, a hit in this element has no real significance for a result item's ranking."}],"meaning":"Specifies how relevant the values of an element are for ranking, if the freestyle search terms match the element value.","engine":"","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Search_ranking","fr":"Pertinence de l’élément dans le classement des résultats (HIGH, MEDIUM, LOW).","kwFr":["classement","pertinence","ranking"],"kwEn":["ranking","relevance"],"usages":["search"]},{"domain":"Search","name":"Search.fuzzinessThreshold","values":[{"value":"Decimal (3,2)","desc":"The least level of fuzziness the element has to have to be considered in a fuzzy search at all, e.g. 0.7.\nThe value can be between 0 and 1. \nWe recommend using the default value 0.7 to start with. Later on, you can fine-tune the search settings based on your experiences with the search. You can also fine-tune the search using feedback collected from your users. A value between 0.7 and 0.99 would be most useful. Use 1 for exact matches."}],"meaning":"Specifies the least level of fuzziness (with regard to some comparison criteria passed at runtime) the element has to have to be considered in a fuzzy search at all.\nNote\nA fuzzy search enables a certain degree of error tolerance and returns records even if the search term contains additional or missing characters or other types of spelling errors. \nNote\nTo perform a fuzzy search you have to set the search mode to fuzzy in the customizing settings of your ABAP system. Find the customizing node under SAP NetWeaver Implementation Guide Search and Operational Analytics Enterprise Search Search Configuration Set Parameters for Federated Search.\nIf in the customizing a value for Fuzzy Similarity is present, the value of the parameter Search.fuzzinessThreshold will become void.","engine":"Interpreted by SADL","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Search_fuzzinessThreshold","fr":"Seuil de recherche floue (tolérance aux fautes).","kwFr":["recherche floue","tolérance","fautes de frappe"],"kwEn":["fuzzy search","threshold"],"usages":["search"]},{"domain":"Search","name":"Search.termMappingDictionary","values":[{"value":"String(128)","desc":"Defines the term mapping dictionary, e.g. a table or entity."}],"meaning":"Specifies the table that holds the term mappings (synonyms) to be considered in the context of a search on this view.","engine":"No engine usage right now. Reserved for future usage.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Search_termMappingDictionary","fr":"Table de synonymes utilisée pour la recherche.","kwFr":["synonymes","dictionnaire","recherche"],"kwEn":["term mapping","synonyms"],"usages":["search"]},{"domain":"Search","name":"Search.termMappingListID","values":[{"value":"Array of String(32)","desc":"Defines one or more columns of the term mapping dictionary."}],"meaning":"Specifies one or multiple list IDs within the term mapping dictionary mentioned before.\nThe list is implemented as a column of the term mapping table, with the list ID as content of this column. This concept has the aim to enable overarching term mapping dictionaries while being able to separate domain-specific content at the same time.","engine":"No engine usage right now. Reserved for future usage.","type":"","notes":[],"deprecated":false,"groupDesc":"","scopes":["ELEMENT"],"id":"Search_termMappingListID","fr":"Identifiant(s) de liste dans le dictionnaire de synonymes.","kwFr":["synonymes","liste"],"kwEn":["term mapping list"],"usages":["search"]}],"scenarios":[{"id":"dim_text","title":"Dimension analytique avec textes","titleEn":"Analytical dimension with texts","desc":"Vue de données de base consommable en analytique, avec clé représentative et textes dépendants de la langue fournis par une vue de textes.","kw":"dimension; données de base; texte; libellé; description; langue; master data; text","usages":["model","text","keys"],"annotations":["Analytics.dataCategory","ObjectModel.representativeKey","ObjectModel.text.association","ObjectModel.dataCategory","Semantics.language","Semantics.text"],"code":"@AccessControl.authorizationCheck: #CHECK\n@EndUserText.label: 'Client - dimension'\n@Analytics.dataCategory: #DIMENSION\n@ObjectModel.representativeKey: 'Customer'\ndefine view entity ZI_Customer\n  as select from zcustomer\n  association [0..*] to ZI_CustomerText as _Text\n    on $projection.Customer = _Text.Customer\n{\n      @ObjectModel.text.association: '_Text'\n  key customer_id as Customer,\n      country     as Country,\n      _Text\n}\n\n// Vue de textes associée\n@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: 'Client - textes'\n@ObjectModel.dataCategory: #TEXT\n@ObjectModel.representativeKey: 'Customer'\ndefine view entity ZI_CustomerText\n  as select from zcustomer_t\n{\n  key customer_id as Customer,\n      @Semantics.language: true\n  key langu       as Language,\n      @Semantics.text: true\n      name        as CustomerName\n}","notes":["ObjectModel.text.association et ObjectModel.text.element s’excluent mutuellement (document source).","[Connaissance] Sur 2025, SAP utilise aussi @ObjectModel.supportedCapabilities (ex. #ANALYTICAL_DIMENSION) : famille absente du document, à vérifier."]},{"id":"cube","title":"Cube : mesures, montants et quantités","titleEn":"Cube with measures, amounts and quantities","desc":"Vue de faits / cube avec mesures agrégées, références devise et unité, et associations de clé étrangère vers les dimensions.","kw":"cube; fait; mesure; indicateur; montant; devise; quantité; unité; somme; key figure","usages":["model","agg","amount","keys"],"annotations":["Analytics.dataCategory","Aggregation.default","Semantics.amount.currencyCode","Semantics.quantity.unitOfMeasure","ObjectModel.foreignKey.association"],"code":"@AccessControl.authorizationCheck: #CHECK\n@EndUserText.label: 'Ventes - cube'\n@Analytics.dataCategory: #CUBE\ndefine view entity ZI_SalesCube\n  as select from ZI_SalesItem\n  association [0..1] to ZI_Customer as _Customer\n    on $projection.Customer = _Customer.Customer\n{\n  key SalesDocument,\n  key SalesDocumentItem,\n      @ObjectModel.foreignKey.association: '_Customer'\n      Customer,\n\n      @Semantics.amount.currencyCode: 'TransactionCurrency'\n      @Aggregation.default: #SUM\n      NetAmount,\n      TransactionCurrency,\n\n      @Semantics.quantity.unitOfMeasure: 'OrderQuantityUnit'\n      @Aggregation.default: #SUM\n      OrderQuantity,\n      OrderQuantityUnit,\n\n      _Customer\n}","notes":["Les éléments sans Aggregation.default (ou #NONE) sont traités comme caractéristiques (GROUP BY) — document source."]},{"id":"query","title":"Requête analytique : filtres, axes, affichage","titleEn":"Analytical query with filters and axes","desc":"Requête consommée par SAC / Analysis / Fiori : filtre obligatoire, sélection multiple, positionnement en lignes/colonnes, affichage clé-texte.","kw":"requête analytique; query; filtre obligatoire; variable; axe; lignes; colonnes; clé texte; SAC; reporting","usages":["query","filter","display"],"annotations":["Analytics.query","Consumption.filter.selectionType","Consumption.filter.mandatory","Consumption.filter.multipleSelections","AnalyticsDetails.query.axis","AnalyticsDetails.query.display","AnalyticsDetails.query.totals","Analytics.settings.zeroValues.handling"],"code":"@AccessControl.authorizationCheck: #NOT_ALLOWED\n@EndUserText.label: 'Ventes par client'\n@Analytics.settings.zeroValues.handling: #HIDE_IF_ALL\ndefine transient view entity ZC_SalesByCustomerQry\n  provider contract analytical_query\n  as projection on ZI_SalesCube\n{\n  @Consumption.filter: { selectionType: #SINGLE, multipleSelections: false, mandatory: true }\n  @AnalyticsDetails.query.axis: #FREE\n  CompanyCode,\n\n  @AnalyticsDetails.query.axis: #ROWS\n  @AnalyticsDetails.query.display: #KEY_TEXT\n  @AnalyticsDetails.query.totals: #SHOW\n  Customer,\n\n  @AnalyticsDetails.query.axis: #COLUMNS\n  NetAmount\n}","notes":["[Connaissance] Sur ABAP Platform 2025, une requête analytique se définit en transient view entity avec « provider contract analytical_query » ; l’annotation @Analytics.query: true sert aux vues CDS classiques (DDIC-based). À vérifier selon ta cible.","CompanyCode est supposé exposé par le cube (exemple fictif)."]},{"id":"param_default","title":"Paramètre avec valeur par défaut ou dérivée","titleEn":"Parameter with default or derived value","desc":"Proposer une valeur par défaut à un paramètre, ou la dériver automatiquement à l’exécution par lecture d’une entité de correspondance.","kw":"paramètre; valeur par défaut; dérivation; lookup; variable; proposition; default","usages":["filter","derive"],"annotations":["Consumption.defaultValue","Consumption.derivation","Consumption.derivation.lookupEntity","Consumption.derivation.resultElement","Consumption.derivation.binding.type","Consumption.hidden"],"code":"define view entity ZC_StockAtDate\n  with parameters\n    @Consumption.defaultValue: '1000'\n    P_Plant      : werks_d,\n\n    @Consumption.derivation: {\n      lookupEntity: 'ZI_PlantCompanyCode',\n      resultElement: 'CompanyCode',\n      binding: [ { targetElement: 'Plant', type: #PARAMETER, value: 'P_Plant' } ]\n    }\n    @Consumption.hidden: true\n    P_CompanyCode : bukrs\n  as select from ZI_Stock( P_Plant: $parameters.P_Plant )\n{\n  key Material,\n      Quantity,\n      Unit\n}","notes":["[Connaissance] Pour une date ou une langue système, @Environment.systemField (#SYSTEM_DATE, #SYSTEM_LANGUAGE…) est l’usage courant : famille absente du document.","Exemple fictif : ZI_PlantCompanyCode et ZI_Stock sont à remplacer."]},{"id":"delta_generic","title":"Extraction avec delta générique (horodatage)","titleEn":"Extraction with generic timestamp delta","desc":"Rendre une vue extractible (ODP → BW/4HANA, Datasphere) avec delta fondé sur un champ date/horodatage, marge de sécurité et détection des suppressions.","kw":"extraction; delta; ODP; BW; Datasphere; réplication; horodatage; timestamp; suppression","usages":["extract"],"annotations":["Analytics.dataExtraction.enabled","Analytics.dataExtraction.delta.byElement.name","Analytics.dataExtraction.delta.byElement.maxDelayInSeconds","Analytics.dataExtraction.delta.byElement.detectDeletedRecords","Semantics.systemDate.lastChangedAt"],"code":"@AccessControl.authorizationCheck: #CHECK\n@EndUserText.label: 'Commandes - extraction delta'\n@Analytics.dataCategory: #FACT\n@Analytics.dataExtraction: {\n  enabled: true,\n  delta.byElement: {\n    name: 'LastChangedAt',\n    maxDelayInSeconds: 1800,\n    detectDeletedRecords: true\n  }\n}\ndefine view entity ZI_OrderExtract\n  as select from zorder\n{\n  key order_id        as OrderId,\n      amount          as Amount,\n      currency        as Currency,\n      @Semantics.systemDate.lastChangedAt: true\n      last_changed_at as LastChangedAt\n}","notes":["Le champ delta doit être une date (DATS) ou un horodatage UTC — document source.","maxDelayInSeconds vaut 1800 par défaut d’après la définition du document."]},{"id":"delta_cdc","title":"Extraction avec delta CDC (Change Data Capture)","titleEn":"Extraction with CDC delta","desc":"Delta par triggers base de données : automatique pour une projection simple, mapping explicite des tables pour une vue avec jointures.","kw":"CDC; change data capture; delta; trigger; jointure; mapping; extraction; Datasphere","usages":["extract"],"annotations":["Analytics.dataExtraction.enabled","Analytics.dataExtraction.delta.changeDataCapture.automatic","Analytics.dataExtraction.delta.changeDataCapture.mapping","Analytics.dataExtraction.delta.changeDataCapture.mapping.role","Analytics.dataExtraction.delta.changeDataCapture.mapping.table","Analytics.dataExtraction.delta.changeDataCapture.mapping.viewElement","Analytics.dataExtraction.delta.changeDataCapture.mapping.tableElement"],"code":"// Cas 1 : projection simple -> CDC automatique\n@Analytics.dataExtraction: {\n  enabled: true,\n  delta.changeDataCapture.automatic: true\n}\n\n// Cas 2 : vue avec jointure -> mapping explicite\n@Analytics.dataExtraction: {\n  enabled: true,\n  delta.changeDataCapture.mapping: [\n    { table: 'ZHEADER', role: #MAIN,\n      viewElement: ['OrderId'], tableElement: ['order_id'] },\n    { table: 'ZPARTNER', role: #LEFT_OUTER_TO_ONE_JOIN,\n      viewElement: ['PartnerId'], tableElement: ['partner_id'] }\n  ]\n}","notes":["viewElement et tableElement doivent contenir le même nombre d’éléments, dans le même ordre — document source."]},{"id":"value_help","title":"Aide à la saisie (F4) avec liaison complémentaire","titleEn":"Value help with additional binding","desc":"Associer une aide à la saisie à un champ, filtrée par la valeur d’un autre champ (ex. divisions de la société sélectionnée).","kw":"aide à la saisie; F4; value help; liste de valeurs; filtrage; liaison","usages":["vh"],"annotations":["Consumption.valueHelpDefinition","Consumption.valueHelpDefinition.entity[]","Consumption.valueHelpDefinition.additionalBinding[]","Consumption.valueHelpDefinition.distinctValues"],"code":"{\n  @Consumption.valueHelpDefinition: [\n    { entity: { name: 'ZI_CompanyCodeVH', element: 'CompanyCode' } }\n  ]\n  CompanyCode,\n\n  @Consumption.valueHelpDefinition: [\n    { entity: { name: 'ZI_PlantVH', element: 'Plant' },\n      additionalBinding: [\n        { localElement: 'CompanyCode', element: 'CompanyCode', usage: #FILTER }\n      ] }\n  ]\n  Plant\n}","notes":["Plusieurs aides à la saisie sur un même élément nécessitent un qualifier — document source."]},{"id":"hierarchy","title":"Hiérarchie parent-enfant","titleEn":"Parent-child hierarchy","desc":"Définir une hiérarchie récursive (ex. organisation, centres de coûts) avec ordre des frères et traitement des nœuds orphelins.","kw":"hiérarchie; parent; enfant; arbre; nœud; organisation; récursif","usages":["hier"],"annotations":["ObjectModel.dataCategory","Hierarchy.parentChild.name","Hierarchy.parentChild.recurseBy","Hierarchy.parentChild.siblingsOrder.by","Hierarchy.parentChild.siblingsOrder.direction","Hierarchy.parentChild.orphanedNode.handling","ObjectModel.hierarchy.association"],"code":"@ObjectModel.dataCategory: #HIERARCHY\n@Hierarchy.parentChild: [ {\n  name: 'ZORG',\n  recurseBy: '_Parent',\n  siblingsOrder: [ { by: 'SortOrder', direction: #ASC } ],\n  orphanedNode.handling: #ROOT_NODES\n} ]\ndefine view entity ZI_OrgUnitHier\n  as select from zorg_unit\n  association [0..1] to ZI_OrgUnitHier as _Parent\n    on $projection.ParentUnit = _Parent.OrgUnit\n{\n  key org_unit    as OrgUnit,\n      parent_unit as ParentUnit,\n      sort_order  as SortOrder,\n      _Parent\n}","notes":["Structure d’après la définition du document (parentChild et siblingsOrder sont des tableaux).","[Connaissance] Sur les versions récentes, les hiérarchies peuvent aussi se définir avec DEFINE HIERARCHY : à vérifier selon le besoin."]},{"id":"exception_agg","title":"Stock : agrégation d’exception (dernière valeur)","titleEn":"Stock with exception aggregation (last value)","desc":"Mesure de stock sommée sur toutes les dimensions sauf le temps, où l’on prend la dernière valeur.","kw":"stock; agrégation d’exception; dernière valeur; non cumulatif; LAST; inventaire","usages":["agg"],"annotations":["Aggregation.default","Aggregation.exception","Aggregation.referenceElement","Semantics.quantity.unitOfMeasure"],"code":"{\n  CalendarDay,\n  Unit,\n\n  @Aggregation.default: #SUM\n  @Aggregation.exception: #LAST\n  @Aggregation.referenceElement: ['CalendarDay']\n  @Semantics.quantity.unitOfMeasure: 'Unit'\n  StockQuantity\n}","notes":["Aggregation.exception requiert Aggregation.default (≠ #NONE) et Aggregation.referenceElement — document source (exemple 2 du domaine Aggregation, coquilles corrigées)."]},{"id":"auth","title":"Contrôle d’autorisation de la vue","titleEn":"View authorization check","desc":"Choisir le comportement du contrôle DCL : obligatoire, contrôle avec avertissement, non requis ou désactivé ; accès privilégié via associations.","kw":"autorisation; DCL; rôle; sécurité; contrôle d’accès; habilitation","usages":["auth"],"annotations":["AccessControl.authorizationCheck","AccessControl.privilegedAssociations","AccessControl.personalData.blocking"],"code":"// Contrôle indispensable : erreur à l'exécution si aucun rôle DCL\n@AccessControl.authorizationCheck: #MANDATORY\ndefine view entity ZI_SalaryData ...\n\n// Contrôle attendu : avertissement à l'activation si pas de rôle\n@AccessControl.authorizationCheck: #CHECK\ndefine view entity ZI_SalesItem ...\n\n// Données non sensibles (ex. textes, customizing)\n@AccessControl.authorizationCheck: #NOT_REQUIRED\ndefine view entity ZI_StatusText ...","notes":["#NOT_REQUIRED est la valeur par défaut si l’annotation est absente — document source."]},{"id":"search","title":"Vue recherchable (recherche libre, floue)","titleEn":"Searchable view (freestyle, fuzzy)","desc":"Activer la recherche plein texte sur une vue, avec éléments de recherche par défaut, pertinence et tolérance aux fautes.","kw":"recherche; plein texte; floue; fuzzy; pertinence; ranking; recherche libre","usages":["search"],"annotations":["Search.searchable","Search.defaultSearchElement","Search.ranking","Search.fuzzinessThreshold"],"code":"@Search.searchable: true\ndefine view entity ZI_ProductSearch\n  as select from zproduct\n{\n      @Search.defaultSearchElement: true\n      @Search.ranking: #HIGH\n  key product_id   as Product,\n\n      @Search.defaultSearchElement: true\n      @Search.ranking: #MEDIUM\n      @Search.fuzzinessThreshold: 0.8\n      product_name as ProductName\n}","notes":["Search.searchable est requis dès qu’une autre annotation Search est utilisée — document source."]},{"id":"time","title":"Dimension temps et exercice comptable","titleEn":"Time and fiscal period semantics","desc":"Typer sémantiquement les champs de calendrier et d’exercice pour les calculs temporels en analytique.","kw":"temps; calendrier; exercice; période comptable; année; mois; trimestre; fiscal","usages":["time"],"annotations":["Semantics.calendar.year","Semantics.calendar.yearMonth","Semantics.calendar.quarter","Semantics.fiscal.year","Semantics.fiscal.period","Semantics.fiscal.yearPeriod","Semantics.fiscal.yearVariant"],"code":"{\n  @Semantics.calendar.year: true\n  CalendarYear,\n  @Semantics.calendar.yearMonth: true\n  YearMonth,\n  @Semantics.calendar.quarter: true\n  CalendarQuarter,\n\n  @Semantics.fiscal.yearVariant: true\n  FiscalYearVariant,\n  @Semantics.fiscal.year: true\n  FiscalYear,\n  @Semantics.fiscal.period: true\n  FiscalPeriod,\n  @Semantics.fiscal.yearPeriod: true\n  FiscalYearPeriod\n}","notes":["Les formats attendus (YYYY, YYYYMM, YYYYPPP…) sont détaillés dans chaque fiche."]},{"id":"vdm","title":"Classification VDM et cycle de vie","titleEn":"VDM classification and lifecycle","desc":"Classer les vues (basic, composite, consumption), marquer une vue privée, déclarer un contrat d’API ou une dépréciation avec successeur.","kw":"VDM; basic; composite; consumption; interface; privée; obsolète; successeur; API","usages":["vdm"],"annotations":["VDM.viewType","VDM.private","VDM.lifecycle.contract.type","VDM.lifecycle.status","VDM.lifecycle.successor"],"code":"@VDM.viewType: #BASIC\ndefine view entity ZI_MyBasicView ...\n\n@VDM.private: true\n@VDM.viewType: #COMPOSITE\ndefine view entity ZP_MyPrivateComposite ...\n\n@VDM.viewType: #CONSUMPTION\ndefine view entity ZC_MyConsumptionView ...\n\n@VDM.lifecycle.status: #DEPRECATED\n@VDM.lifecycle.successor: 'ZI_MySuccessorView'\ndefine view entity ZI_MyDeprecatedView ...","notes":["D’après le document, la classification VDM est destinée à la structuration interne SAP ; son usage en développement client relève d’une convention projet."]}]}</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`]/g,"'").toLowerCase();
const store={get(k,d){try{const v=localStorage.getItem('cdsann.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('cdsann.'+k,JSON.stringify(v))}catch(e){}}};

function start(D){
const A=D.annotations, U=D.usages, byName={}, byId={};
A.forEach(a=>{byName[a.name]=a;a.hid=a.id.replace(/_/g,'-');byId[a.hid]=a;
  a.ix={name:norm(a.name),last:norm(a.name.split('.').pop()),kw:norm([...a.kwFr,...a.kwEn].join(' | ')),fr:norm(a.fr),
    us:norm(a.usages.map(u=>U[u].fr+' '+U[u].en).join(' ')),dom:norm(a.domain+' '+(a.group||'')),
    src:norm(a.meaning+' '+a.groupDesc+' '+a.values.map(v=>v.value+' '+v.desc).join(' ')+' '+a.type)};
  a.scen=D.scenarios.filter(s=>s.annotations.includes(a.name)).map(s=>s.id);
});
const DOMS=D.domains.map(d=>d.domain);
const SCOPES=['VIEW','ENTITY','ELEMENT','PARAMETER','TABLE_FUNCTION','EXTEND_VIEW'];
const st=Object.assign({q:'',dom:[],us:[],sc:[],dep:true,sel:null,view:'ann'},store.get('st',{}));
st.q='';

$('#meta').textContent=`${A.length} annotations · ${DOMS.length} domaines · ${D.scenarios.length} scénarios · ${D.meta.version}`;
$('#foot').innerHTML=`<b>Source :</b> ${esc(D.meta.source)}. <b>Cible :</b> ${esc(D.meta.target)}. Le document source ne donne pas la disponibilité par release : en cas de doute, vérifier dans ADT (F1) ou sur help.sap.com. Les éléments marqués « Ajout » (résumés, mots-clés, thèmes, scénarios, exemples générés) sont rédigés pour cet outil et doivent être relus. Généré le ${esc(D.meta.built)}.`;

let facOpen=matchMedia('(min-width:1101px)').matches;
function chip(group,key,label,count){const on=st[group].includes(key);return `<button class="chip" aria-pressed="${on}" data-g="${group}" data-k="${esc(key)}">${esc(label)}${count!=null?`<small>${count}</small>`:''}</button>`}
function renderFacets(){
  const cnt=(f)=>A.filter(f).length;
  const n=st.dom.length+st.us.length+st.sc.length;
  $('#facets').innerHTML=
   `<details id="fold" ${facOpen?'open':''}><summary>Filtres${n?` (${n} actif${n>1?'s':''})`:''}</summary><h3>Thèmes d’usage <span class="tag add">Ajout</span></h3><div class="chips">${Object.entries(U).map(([k,v])=>chip('us',k,v.fr,cnt(a=>a.usages.includes(k)))).join('')}</div>
    <h3>Domaine</h3><div class="chips">${DOMS.map(d=>chip('dom',d,d,cnt(a=>a.domain===d))).join('')}</div>
    <h3>Portée (scope)</h3><div class="chips">${SCOPES.map(s=>chip('sc',s,'#'+s,cnt(a=>a.scopes.includes(s)))).join('')}</div>
    <label class="ck"><input type="checkbox" id="dep" ${st.dep?'checked':''}> Inclure les annotations obsolètes</label>
    <button class="reset" id="reset">Réinitialiser les filtres</button></details>`;
  $('#fold').addEventListener('toggle',e=>{facOpen=e.target.open});
}

function score(a,toks,phrase){
  let s=0;
  for(const t of toks){
    let m=0;
    if(a.ix.last.startsWith(t))m+=16;else if(a.ix.name.includes(t))m+=10;
    if(a.ix.kw.includes(t))m+=6;
    if(a.ix.fr.includes(t))m+=4;
    if(a.ix.us.includes(t)||a.ix.dom.includes(t))m+=3;
    if(!m&&a.ix.src.includes(t))m+=1;
    if(!m)return 0;
    s+=m;
  }
  if(phrase&&toks.length>1&&(a.ix.kw.includes(phrase)||a.ix.fr.includes(phrase)))s+=10;
  return s;
}
function filtered(){
  const phrase=norm(st.q).trim();
  const toks=phrase.split(/[\s,;@:]+/).filter(t=>t.length>1);
  let r=A.filter(a=>(st.dep||!a.deprecated)&&(!st.dom.length||st.dom.includes(a.domain))&&
    (!st.us.length||st.us.some(u=>a.usages.includes(u)))&&(!st.sc.length||st.sc.some(s=>a.scopes.includes(s))));
  if(toks.length){r=r.map(a=>[a,score(a,toks,phrase)]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]).map(x=>x[0])}
  return {r,toks};
}
function hl(text,toks){
  let h=esc(text);if(!toks.length)return h;
  const n=norm(text);const marks=[];
  toks.forEach(t=>{let i=0;while((i=n.indexOf(t,i))>-1){marks.push([i,i+t.length]);i+=t.length}});
  if(!marks.length)return h;
  marks.sort((a,b)=>a[0]-b[0]);let out='',p=0;
  for(const[s,e]of marks){if(s<p)continue;out+=esc(text.slice(p,s))+'<mark>'+esc(text.slice(s,e))+'</mark>';p=e}
  return out+esc(text.slice(p));
}
let current=[];
function renderList(){
  const {r,toks}=filtered();current=r;
  const active=st.dom.length+st.us.length+st.sc.length;
  $('#list').innerHTML=`<div class="count"><span>${r.length} résultat${r.length>1?'s':''}${active?` · ${active} filtre${active>1?'s':''}`:''}</span>${st.q?'<span>trié par pertinence</span>':'<span>ordre du document</span>'}</div>`+
   (r.length?r.slice(0,300).map(a=>`<button class="item" data-id="${a.hid}" aria-current="${st.sel===a.hid}">
     <div class="n">@${hl(a.name,toks)}</div><div class="f">${hl(a.fr,toks)}</div>
     <div class="m"><span>${esc(a.domain)}</span>${a.scopes.map(s=>`<span>#${s}</span>`).join('')}${a.deprecated?'<span class="tag dep">obsolète</span>':''}${a.scen.length?`<span class="tag sc">${a.scen.length} scénario${a.scen.length>1?'s':''}</span>`:''}</div></button>`).join('')
    :`<div class="empty">Aucune annotation ne correspond. Essayez un synonyme (ex. « montant » ou « amount »), retirez un filtre, ou consultez l’onglet Scénarios.</div>`);
}
function exampleOf(a){
  let n='@'+a.name.replace(/\s*\[\s*\]\s*/g,'').replace(/\*$/,'').replace(/\.$/,'');
  const t=(a.type||'').toLowerCase();let v='';
  const ev=a.values.map(x=>x.value.trim()).find(x=>/^#?[A-Z][A-Z0-9_]+$/.test(x));
  if(ev)v='#'+ev.replace('#','');
  else if(a.values.some(x=>/^true$/i.test(x.value))||t.includes('boolean'))v='true';
  else if(t.includes('elementref')||a.values.some(x=>/elementref|associationref/i.test(x.value)))v="'NomElement'";
  else if(t.includes('integer')||a.values.some(x=>/integer/i.test(x.value)))v='0';
  else v="'…'";
  return `${n}: ${v}`;
}
function related(a){
  const parts=a.name.split('.');const pref=parts.slice(0,Math.max(2,parts.length-1)).join('.');
  return A.filter(b=>b!==a&&b.name.startsWith(pref)).slice(0,14);
}
function codeBlock(code,label){return `<div class="codewrap"><button class="btn" data-copy="${esc(code)}">Copier</button><pre><code>${esc(code)}</code></pre></div>`}
function renderDetail(){
  const a=byId[st.sel];
  if(!a){$('#detail').innerHTML=`<div class="empty"><h3 style="font-size:20px;margin-bottom:8px">Choisissez une annotation</h3>Tapez un besoin en français ou en anglais (« libellé », « currency », « obligatoire »), ou filtrez par thème d’usage à gauche. Les scénarios regroupent les annotations d’un cas complet avec un squelette de code.</div>`;return}
  const rel=related(a);const sc=D.scenarios.filter(s=>a.scen.includes(s.id));
  $('#detail').innerHTML=`<button class="btn back" id="back">← Résultats</button>
   <div class="dh"><h2>@${esc(a.name)}</h2><button class="btn" data-copy="@${esc(a.name.replace(/\s*\[\s*\]\s*/g,''))}">Copier le nom</button></div>
   <div class="m" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${esc(a.domain)}</span>${a.group?`<span class="tag">${esc(a.group)}</span>`:''}${a.deprecated?'<span class="tag dep">obsolète</span>':''}</div>
   <div class="sec"><h3>En bref <span class="tag add">Ajout</span></h3><div class="box add">
     <div style="font-size:16px">${esc(a.fr)}</div>
     <div class="note" style="margin-top:8px"><b>Mots-clés FR :</b> ${esc(a.kwFr.join(', '))}<br><b>Keywords EN:</b> ${esc(a.kwEn.join(', '))}<br><b>Thèmes :</b> ${a.usages.map(u=>esc(U[u].fr)).join(' · ')}</div>
   </div></div>
   <div class="sec"><h3>Exemple de syntaxe <span class="tag add">Ajout, généré</span></h3>${codeBlock(exampleOf(a))}
     <div class="note" style="margin-top:6px">Valeur indicative tirée du type ou de la première valeur listée : à adapter.</div></div>
   <div class="sec"><h3>Documentation SAP <span class="tag src">Source</span></h3><div class="box src">
     <dl class="kv">
      <dt>Portée</dt><dd>${a.scopes.length?a.scopes.map(s=>'#'+s).join(', '):'non précisée'}${a.scopeInherited?' <span class="note">(déduite de l’annotation parente)</span>':''}</dd>
      ${a.type?`<dt>Type</dt><dd class="mono" style="font-size:13px">${esc(a.type)}</dd>`:''}
      ${a.engine?`<dt>Moteur</dt><dd>${esc(a.engine)}</dd>`:''}
     </dl>
     ${a.groupDesc?`<p class="text note">${esc(a.groupDesc)}</p>`:''}
     ${a.meaning?`<p class="text" lang="en">${esc(a.meaning)}</p>`:'<p class="note">Pas de description dans le document source.</p>'}
     ${a.values.length?`<table><thead><tr><th>Valeur</th><th>Description</th></tr></thead><tbody>${a.values.map(v=>`<tr><td>${esc(v.value)}</td><td class="text" lang="en">${esc(v.desc)}</td></tr>`).join('')}</tbody></table>`:''}
     ${a.notes.length?`<ul class="note">${a.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
   </div></div>
   ${sc.length?`<div class="sec"><h3>Utilisée dans les scénarios</h3><div class="rel">${sc.map(s=>`<button data-scen="${s.id}" style="font-family:Inter">${esc(s.title)}</button>`).join('')}</div></div>`:''}
   ${rel.length?`<div class="sec"><h3>Annotations voisines</h3><div class="rel">${rel.map(b=>`<button data-id="${b.hid}">@${esc(b.name)}</button>`).join('')}</div></div>`:''}
   <div class="sec note">Domaine ${esc(a.domain)} : <a href="#" data-dom="${esc(a.domain)}">voir la définition complète et les exemples SAP</a></div>`;
  $('#detail').scrollTop=0;
}
function renderScen(){
  const toks=norm(st.q).split(/\s+/).filter(t=>t.length>1);
  const list=D.scenarios.filter(s=>!toks.length||toks.every(t=>norm(s.title+' '+s.titleEn+' '+s.desc+' '+s.kw+' '+s.annotations.join(' ')).includes(t)));
  $('#view-scen').innerHTML=`<div class="cards">${list.length?list.map(s=>`<article class="card" id="s-${s.id}">
     <div><h2>${esc(s.title)}</h2><div class="en">${esc(s.titleEn)}</div></div>
     <div><span class="tag add">Ajout, à relire</span> ${s.usages.map(u=>`<span class="tag">${esc(U[u].fr)}</span>`).join(' ')}</div>
     <p style="margin:0">${esc(s.desc)}</p>
     <div class="rel">${s.annotations.map(n=>`<button data-id="${byName[n].hid}">@${esc(n)}</button>`).join('')}</div>
     ${codeBlock(s.code)}
     <ul class="note">${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}<li>Les objets Z* et les tables z* sont des exemples fictifs.</li></ul>
   </article>`).join(''):'<div class="empty">Aucun scénario ne correspond à la recherche.</div>'}</div>`;
}
function renderDom(){
  $('#view-dom').innerHTML=`<div class="cards">${D.domains.map(d=>`<article class="card" id="d-${d.domain}">
    <div><h2>@${esc(d.domain)}</h2><div class="en">${d.nAnnotations} annotations</div></div>
    <div class="box add"><span class="tag add">Ajout</span> ${esc(d.fr)}</div>
    <div class="box src"><span class="tag src">Source</span> <span lang="en">${esc(d.description)}</span></div>
    <button class="btn" data-filterdom="${esc(d.domain)}" style="align-self:flex-start">Lister les annotations du domaine</button>
    ${d.definition?`<details><summary>Définition de l’annotation (source)</summary>${codeBlock(d.definition)}</details>`:''}
    ${d.after?`<details><summary>Notes et exemples SAP (source)</summary><div class="box src text" lang="en" style="font-size:13.5px;margin-top:8px">${esc(d.after)}</div></details>`:''}
  </article>`).join('')}</div>`;
}
function setView(v){
  st.view=v;['ann','scen','dom'].forEach(k=>{$('#t-'+k).setAttribute('aria-selected',k===v);$('#view-'+k).hidden=k!==v});
  if(v==='scen')renderScen();if(v==='dom')renderDom();
}
function select(id,push=true){
  st.sel=id;document.body.classList.toggle('showdetail',!!id);
  document.querySelectorAll('.item').forEach(e=>e.setAttribute('aria-current',e.dataset.id===id));
  renderDetail();if(push&&id){try{history.replaceState(null,'','#a-'+id)}catch(e){location.hash='a-'+id}}
  store.set('st',{dom:st.dom,us:st.us,sc:st.sc,dep:st.dep});
}
function refresh(){renderFacets();renderList();if(st.view==='scen')renderScen()}
let timer;
$('#q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{st.q=e.target.value;renderList();if(st.view==='scen')renderScen();
  if(st.view!=='scen'&&current.length&&st.q&&matchMedia('(min-width:761px)').matches)select(current[0].hid,false)},90)});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!current.length)return;
    let i=current.findIndex(a=>a.hid===st.sel);i=e.key==='ArrowDown'?Math.min(current.length-1,i+1):Math.max(0,i-1);
    select(current[i].hid);document.querySelector(`.item[data-id="${current[i].hid}"]`)?.scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'&&current.length&&!st.sel)select(current[0].hid);
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();$('#q').select()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.copy!=null){const txt=t.dataset.copy;
    const ok=()=>{const el=$('#toast');el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1100)};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,()=>fallback(txt,ok));else fallback(txt,ok);return}
  if(t.dataset.g){const g=t.dataset.g,k=t.dataset.k;st[g]=st[g].includes(k)?st[g].filter(x=>x!==k):[...st[g],k];refresh();store.set('st',{dom:st.dom,us:st.us,sc:st.sc,dep:st.dep});return}
  if(t.id==='reset'){st.dom=[];st.us=[];st.sc=[];st.dep=true;refresh();store.set('st',{dom:[],us:[],sc:[],dep:true});return}
  if(t.dataset.v){setView(t.dataset.v);return}
  if(t.id==='back'){document.body.classList.remove('showdetail');return}
  if(t.dataset.id){setView('ann');select(t.dataset.id);window.scrollTo({top:0});return}
  if(t.dataset.scen){setView('scen');document.getElementById('s-'+t.dataset.scen)?.scrollIntoView();return}
  if(t.dataset.dom){e.preventDefault();setView('dom');document.getElementById('d-'+t.dataset.dom)?.scrollIntoView();return}
  if(t.dataset.filterdom){st.dom=[t.dataset.filterdom];setView('ann');refresh();return}
});
document.addEventListener('change',e=>{if(e.target.id==='dep'){st.dep=e.target.checked;refresh()}});
function fallback(txt,ok){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()}
function fromHash(){const h=location.hash.slice(1);if(h.startsWith('a-')&&byId[h.slice(2)]){setView('ann');select(h.slice(2),false)}}
window.addEventListener('hashchange',fromHash);
refresh();setView('ann');renderDetail();fromHash();
}

const raw=document.getElementById('data').textContent.trim();
if(raw&&!raw.startsWith('/*'))start(JSON.parse(raw));
else fetch('data.json').then(r=>r.json()).then(start).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">Données introuvables (data.json).</div>'});
}
</script>
</body>
